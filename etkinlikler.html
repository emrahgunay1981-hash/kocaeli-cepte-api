<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kocaeli Cepte - Etkinlikler</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

.header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #0d241a;
    padding: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.back {
    display: inline-block;
    margin-top: 8px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
}

.container {
    padding: 16px;
    max-width: 800px;
    margin: auto;
}

.status {
    text-align: center;
    padding: 25px 10px;
    color: #bbb;
}

.theatre-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #168a52, #0d5c37);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 16px;
    text-decoration: none;
    color: white;
}

.theatre-card-text {
    flex: 1;
}

.theatre-card-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
}

.theatre-card-sub {
    font-size: 13px;
    color: #d9f2e4;
}

.theatre-card-arrow {
    font-size: 22px;
    margin-left: 12px;
}

.event {
    background: #102033;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid #1d354d;
}

.event h2 {
    margin: 0 0 10px;
    font-size: 18px;
}

.event p {
    margin: 7px 0;
    color: #cbd5e1;
    line-height: 1.4;
}

.event a {
    display: inline-block;
    margin-top: 10px;
    padding: 9px 14px;
    background: #168a52;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
}

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="header">
    <h1>📅 Kocaeli Etkinlikleri</h1>
    <a class="back" href="index.html">← Kocaeli Cepte'ye Dön</a>
</div>

<div class="container">

    <a class="theatre-card" href="https://tiyatro.kocaeli.bel.tr/tr/tiyatro/oyunlar" target="_blank" rel="noopener">
        <div class="theatre-card-text">
            <div class="theatre-card-title">🎭 Kocaeli Şehir Tiyatrosu</div>
            <div class="theatre-card-sub">Güncel oyun takvimini görüntüle</div>
        </div>
        <div class="theatre-card-arrow">→</div>
    </a>

    <div id="status" class="status">
        Etkinlikler yükleniyor...
    </div>

    <div id="events"></div>

</div>

<script>

async function etkinlikleriGetir() {

    const status = document.getElementById("status");
    const eventsDiv = document.getElementById("events");

    try {

        const response = await fetch(
            "https://kocaeli-cepte-api.vercel.app/api/etkinlikler"
        );

        if (!response.ok) {
            throw new Error("API bağlantısı başarısız");
        }

        const data = await response.json();

        status.style.display = "none";

        if (!data.events || data.events.length === 0) {

            eventsDiv.innerHTML = `
                <div class="empty">
                    Şu anda etkinlik bulunamadı.
                </div>
            `;

            return;
        }

        eventsDiv.innerHTML = data.events.map(event => `

            <div class="event">

                <h2>
                    ${event.title || "Kocaeli Etkinliği"}
                </h2>

                ${
                    event.date
                    ? `<p>📅 ${event.date}</p>`
                    : ""
                }

                ${
                    event.location
                    ? `<p>📍 ${event.location}</p>`
                    : ""
                }

                ${
                    event.description
                    ? `<p>${event.description}</p>`
                    : ""
                }

                ${
                    event.url
                    ? `
                    <a href="${event.url}" target="_blank">
                        Etkinlik Detayları →
                    </a>
                    `
                    : ""
                }

            </div>

        `).join("");

    } catch (error) {

    console.error("ETKİNLİK API HATASI:", error);

    status.innerHTML = `
        <div style="color:#ff6b6b;">
            ❌ Etkinlikler yüklenemedi.
            <br><br>
            <strong>Hata:</strong>
            ${error.message || error}
            <br><br>
            <small>
                API bağlantısı kontrol ediliyor...
            </small>
        </div>
    `;
    }
}

etkinlikleriGetir();

</script>

</body>
</html>
