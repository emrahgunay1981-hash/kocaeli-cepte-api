<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kocaeli Cepte</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  background: #0b1710;
  color: #f2f5f2;
  padding-bottom: 90px;
}

a {
  text-decoration: none;
  color: inherit;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 18px 14px;
}

.logo-badge {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: linear-gradient(160deg, #1e5631, #123a20);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.brand-name {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.brand-name span {
  color: #34c759;
}

.brand-tag {
  font-size: 10px;
  letter-spacing: 2px;
  color: #7f9b87;
  text-transform: uppercase;
}

.market {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin: 0 16px 18px;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.market::-webkit-scrollbar {
  display: none;
}

.market-card {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #10241a;
  border: 1px solid #1c3826;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 12px;
  position: relative;
}

.market-icon {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.market-name {
  color: #9fb8a8;
  font-size: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.market-val {
  font-weight: 700;
  font-size: 12.5px;
}

.market-chg {
  font-size: 10px;
}

.market-demo {
  font-size: 8px;
  color: #6b8574;
  background: #16301f;
  border-radius: 4px;
  padding: 1px 4px;
}

.up {
  color: #34c759;
}

.down {
  color: #ff453a;
}

.cats {
  display: flex;
  gap: 22px;
  overflow-x: auto;
  padding: 4px 18px 20px;
  scrollbar-width: none;
}

.cats::-webkit-scrollbar {
  display: none;
}

.cat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  opacity: 0.85;
}

.cat.active {
  opacity: 1;
}

.cat-circle {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #14261a;
  border: 1px solid #1f3d28;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.cat.active .cat-circle {
  border-color: #34c759;
  background: #16321f;
}

.cat-label {
  font-size: 11px;
  color: #b7c9bd;
  white-space: nowrap;
}

.cat.active .cat-label {
  color: #34c759;
  font-weight: 600;
}

section {
  padding: 0 16px;
  margin-bottom: 26px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.section-title {
  font-size: 16px;
  font-weight: 800;
}

.section-more {
  font-size: 12px;
  color: #7fbf8f;
}

.news-grid {
  display: flex;
  gap: 12px;
  align-items: stretch;
}

.news-hero {
  position: relative;
  flex: 1.3;
  border-radius: 16px;
  overflow: hidden;
  min-height: 230px;
  background: linear-gradient(160deg, #173322, #0d1f15);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: flex-end;
  padding: 14px;
}

.news-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    0deg,
    rgba(0,0,0,0.75) 10%,
    rgba(0,0,0,0.1) 70%
  );
}

.news-hero > * {
  position: relative;
  z-index: 1;
}

.news-hero .tag {
  position: absolute;
  top: 12px;
  left: 12px;
  background: #34c759;
  color: #06210f;
  font-size: 10px;
  font-weight: 800;
  padding: 4px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
}

.news-hero h3 {
  font-size: 17px;
  line-height: 1.3;
}

.news-hero .time {
  font-size: 11px;
  color: #cfe8d6;
  margin-top: 6px;
  display: block;
}

.news-side {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.news-item {
  background: #101f16;
  border: 1px solid #1a3223;
  border-radius: 12px;
  padding: 10px;
  font-size: 12.5px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.news-item .time {
  color: #7f9b87;
  font-size: 11px;
  margin-top: 4px;
  display: block;
}

.card {
  background: #10241a;
  border: 1px solid #1c3826;
  border-radius: 16px;
  padding: 16px;
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.card-head h4 {
  font-size: 15px;
  font-weight: 800;
}

.card-head .sub {
  font-size: 11px;
  color: #7f9b87;
}

.card-head .more {
  font-size: 11px;
  color: #7fbf8f;
}

.grid4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  text-align: center;
}

.grid4 a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: #cfe8d6;
}

.grid4 .ic {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #16301f;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.placeholder {
  text-align: center;
  padding: 26px 10px;
  color: #7f9b87;
  font-size: 12.5px;
}

.placeholder .big {
  font-size: 26px;
  display: block;
  margin-bottom: 6px;
}

.bottomnav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0d1a12;
  border-top: 1px solid #1c3826;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 0 14px;
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  color: #7f9b87;
}

.nav-item.active {
  color: #34c759;
}

.nav-fab {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #34c759;
  color: #06210f;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  margin-top: -22px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo-badge">🏙️</div>

  <div>
    <div class="brand-name">
      KOCAELİ <span>CEPTE</span>
    </div>

    <div class="brand-tag">
      Şehrin cepteki hali
    </div
