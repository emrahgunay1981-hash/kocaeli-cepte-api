<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kocaeli Cepte - Esnaf Rehberi</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

.header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #0d241a;
    padding: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.back {
    display: inline-block;
    margin-top: 8px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
}

.container {
    padding: 16px;
    max-width: 800px;
    margin: auto;
}

select {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0d241a;
    color: white;
    font-size: 15px;
    margin-bottom: 12px;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
}

.category-btn {
    background: #0d241a;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 12px 4px;
    text-align: center;
    color: #aeb8c4;
    font-size: 11px;
    cursor: pointer;
}

.category-btn .icon {
    font-size: 22px;
    display: block;
    margin-bottom: 4px;
}

.category-btn.active {
    background: #123a29;
    border-color: #12c95d;
    color: #12c95d;
}

.status {
    text-align: center;
    padding: 25px 10px;
    color: #bbb;
}

.card {
    background: #102033;
    border: 1px solid #1d354d;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    background: #1d354d;
}

.card-body {
    padding: 14px 16px;
}

.card-name {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 6px;
}

.card-address {
    color: #aeb8c4;
    font-size: 13px;
    margin-bottom: 10px;
    line-height: 1.4;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
}

.badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
}

.badge-google {
    background: #1a3a2a;
    color: #4ade80;
}

.badge-open {
    background: #1a3a2a;
    color: #4ade80;
}

.badge-closed {
    background: #3a1a1a;
    color: #f87171;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.btn {
    flex: 1;
    text-align: center;
    padding: 11px 8px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
}

.btn-call {
    background: #12c95d;
    color: #07111f;
}

.btn-map {
    background: #172b40;
    color: white;
}

.error {
    background: #32151a;
    color: #ffb4b4;
    padding: 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="header">
    <h1>🏪 Esnaf Rehberi</h1>
    <a class="back" href="index.html">← Kocaeli Cepte'ye Dön</a>
</div>

<div class="container">

    <div class="category-grid" id="category-grid">
        <div class="category-btn" data-kategori="kuafor">
            <span class="icon">💇</span>Kuaför
        </div>
        <div class="category-btn" data-kategori="market">
            <span class="icon">🛒</span>Market
        </div>
        <div class="category-btn" data-kategori="oto_tamirci">
            <span class="icon">🚗</span>Oto Tamirci
        </div>
        <div class="category-btn" data-kategori="elektrikci">
            <span class="icon">⚡</span>Elektrikçi
        </div>
        <div class="category-btn" data-kategori="su_tesisatcisi">
            <span class="icon">🚰</span>Tesisatçı
        </div>
        <div class="category-btn" data-kategori="cilingir">
            <span class="icon">🔑</span>Çilingir
        </div>
        <div class="category-btn" data-kategori="veteriner">
            <span class="icon">🐾</span>Veteriner
        </div>
        <div class="category-btn" data-kategori="terzi">
            <span class="icon">👔</span>Terzi
        </div>
    </div>

    <select id="district">
        <option value="Kocaeli">Kocaeli - Tüm İlçeler</option>
        <option value="İzmit">İzmit</option>
        <option value="Gebze">Gebze</option>
        <option value="Darıca">Darıca</option>
        <option value="Körfez">Körfez</option>
        <option value="Başiskele">Başiskele</option>
        <option value="Kartepe">Kartepe</option>
        <option value="Gölcük">Gölcük</option>
        <option value="Derince">Derince</option>
        <option value="Çayırova">Çayırova</option>
        <option value="Dilovası">Dilovası</option>
        <option value="Kandıra">Kandıra</option>
        <option value="Karamürsel">Karamürsel</option>
    </select>

    <div id="status" class="status">
        Bir kategori seçin.
    </div>

    <div id="businesses"></div>

</div>

<script>

const categoryGrid = document.getElementById("category-grid");
const district = document.getElementById("district");
const status = document.getElementById("status");
const businessesDiv = document.getElementById("businesses");

let currentCategory = null;

const categoryLabels = {
    kuafor: "Kuaför/Berber",
    market: "Market",
    oto_tamirci: "Oto Tamirci",
    elektrikci: "Elektrikçi",
    su_tesisatcisi: "Su Tesisatçısı",
    cilingir: "Çilingir",
    veteriner: "Veteriner",
    terzi: "Terzi"
};

categoryGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".category-btn");
    if (!btn) return;

    document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    currentCategory = btn.dataset.kategori;
    esnafGetir();
});

district.addEventListener("change", () => {
    if (currentCategory) esnafGetir();
});

async function esnafGetir() {

    status.style.display = "block";
    status.textContent = categoryLabels[currentCategory] + " aranıyor...";
    businessesDiv.innerHTML = "";

    try {

        const response = await fetch(
            "https://kocaeli-cepte-api.vercel.app/api/esnaf?kategori=" +
            encodeURIComponent(currentCategory) +
            "&ilce=" + encodeURIComponent(district.value)
        );

        if (!response.ok) {
            const errBody = await response.text();
            throw new Error("HTTP " + response.status + " — " + errBody.slice(0, 500));
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Bilinmeyen hata");
        }

        status.style.display = "none";

        if (!data.businesses || data.businesses.length === 0) {
            businessesDiv.innerHTML = '<div class="status">Bu bölgede sonuç bulunamadı.</div>';
            return;
        }

        businessesDiv.innerHTML = data.businesses.map(b => {

            const openBadge = b.openNow === true
                ? '<span class="badge badge-open">Açık</span>'
                : b.openNow === false
                ? '<span class="badge badge-closed">Kapalı</span>'
                : '';

            const ratingBadge = b.rating
                ? '<span class="badge badge-google">⭐ ' + b.rating + ' (' + b.ratingCount + ')</span>'
                : '';

            const imgHtml = b.photoUrl
                ? '<img src="' + b.photoUrl + '" alt="' + b.name + '">'
                : '';

            const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(b.name + " " + b.address) +
                "&query_place_id=" + b.id;

            const phoneClean = b.phone ? b.phone.replace(/[^0-9+]/g, "") : "";

            return `
                <div class="card">
                    ${imgHtml}
                    <div class="card-body">
                        <div class="card-name">${b.name}</div>
                        <div class="card-address">📍 ${b.address}</div>
                        <div class="badges">
                            ${ratingBadge}
                            ${openBadge}
                        </div>
                        <div class="buttons">
                            ${b.phone
                                ? '<a class="btn btn-call" href="tel:' + phoneClean + '">📞 Ara</a>'
                                : ''
                            }
                            <a class="btn btn-map" href="${mapsUrl}" target="_blank" rel="noopener">🗺️ Yol Tarifi</a>
                        </div>
                    </div>
                </div>
            `;

        }).join("");

    } catch (error) {

        console.error("ESNAF API HATASI:", error);

        status.style.display = "block";
        status.innerHTML = `
            <div class="error">
                ❌ Sonuçlar yüklenemedi.
                <br><br>
                <strong>Hata:</strong> ${error.message || error}
            </div>
        `;

    }

}

</script>

</body>
  </html>
