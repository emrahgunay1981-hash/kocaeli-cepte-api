/* =========================================================

.news {

.news-card {

    linear-gradient(

/* =========================================================

    #4f8098;

/* =========================================================
   HABER İÇERİĞİ
========================================================= */

.news-title {

    #7f9fb5;

}


/* =========================================================
   YÜKLENİYOR / BOŞ / HATA
========================================================= */

.loading,
.empty,
.error {

  text-align: center;

  padding:
    45px 15px;

  color:
    #8eacbf;

}

.loading-icon {

  font-size: 28px;

  margin-bottom: 8px;
}


/* =========================================================
   YÜKLENİYOR İKONU
========================================================= */

.loading-icon {

  filter:
    drop-shadow(
      0 0 8px

    );
}


/* =========================================================
   HATA BUTONU
========================================================= */

.error button {

  border: 0 !important;

    0 5px 15px

/* =========================================================

<body>


<!-- =======================================================
     HEADER
======================================================= -->

<div class="header">

  <div class="logo">
    🏙️
  </div>

  <div>

    <div class="brand">
      KOCAELİ <span>CEPTE</span>
    </div>

    <div class="subtitle">
      Şehrin cepteki hali
    </div>

  </div>

</div>


<!-- =======================================================
     GERİ
======================================================= -->

<div class="back">

  <a href="index.html">

    ← Ana Sayfaya Dön

  </a>

</div>


<!-- =======================================================
     BAŞLIK
======================================================= -->

<div class="page-title">

  <h1>
    📰 Kocaeli Haberleri
  </h1>

  <p>
    Kocaeli'nin farklı haber kaynaklarından güncel haberler
  </p>

</div>


<!-- =======================================================
     ARAMA
======================================================= -->

<div class="search-wrap">

  <div class="search-box">

    <span class="icon">🔍</span>

    <input
      type="text"
      id="searchInput"
      placeholder="Haberlerde ara..."
      autocomplete="off"
    >

    <button
      class="clear"
      id="clearSearch"
      aria-label="Aramayı temizle"
    >✕</button>

  </div>

</div>


<!-- =======================================================
     FİLTRELER
======================================================= -->

<div
  class="filters"
  id="filters"
>

  <div
    class="filter active"
    data-source="Tümü"
  >
    Tümü
  </div>

</div>


<!-- =======================================================
     HABERLER
======================================================= -->

<div
  class="news"
  id="news"
>

  <div class="loading">

    <div class="loading-icon">
      📰
    </div>

    Haberler yükleniyor...

  </div>

</div>


<script>

/* =========================================================
   HABERLER
========================================================= */

let allNews = [];
let currentSource = "Tümü";
let searchQuery = "";


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function escapeHtml(str) {

  if (!str) return "";

  return String(str)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================================================
   ARAMA İÇİN METİN NORMALİZASYONU
   (büyük/küçük harf ve Türkçe karakter farkı gözetmez)
========================================================= */

function normalize(str) {

  return String(str || "")
    .toLocaleLowerCase("tr-TR")
    .trim();

}


/* =========================================================
   KAYNAK FİLTRELERİNİ OLUŞTUR
   (haberlerde o an gerçekten var olan kaynaklardan)
========================================================= */

function renderFilters() {

  const filtersContainer =
    document.getElementById("filters");


  const uniqueSources = [];

  const seen = new Set();


  allNews.forEach(item => {

    const source =
      String(item.source || "").trim();


    if (source && !seen.has(source)) {

      seen.add(source);

      uniqueSources.push(source);

    }

  });


  const allTabs =
    ["Tümü", ...uniqueSources];


  filtersContainer.innerHTML =

    allTabs.map(source => `

      <div
        class="filter${source === currentSource ? " active" : ""}"
        data-source="${escapeHtml(source)}"
      >
        ${escapeHtml(source)}
      </div>

    `).join("");

}


/* =========================================================
   HABERLERİ GÖSTER
========================================================= */

function renderNews() {

  const container =
    document.getElementById("news");


  let news =
    allNews;


  if (currentSource !== "Tümü") {

    news =
      news.filter(item =>

        String(
          item.source || ""
        ).trim() === currentSource

      );

  }


  if (searchQuery) {

    const q =
      normalize(searchQuery);

    news =
      news.filter(item =>

        normalize(item.title).includes(q)

      );

  }


  if (!news.length) {

    container.innerHTML = `

      <div class="empty">

        📰

        <br><br>

        ${
          searchQuery
            ? "Aramanızla eşleşen bir haber bulunamadı."
            : "Bu kaynakta şu anda haber bulunamadı."
        }

      </div>

    `;

    return;

  }


  container.innerHTML =

    news.map(item => {

      const title =
        escapeHtml(
          item.title ||
          "Başlıksız haber"
        );


      const sourceName =
        escapeHtml(
          item.source ||
          "Kocaeli"
        );


      const time =
        escapeHtml(
          item.time ||
          ""
        );


      const link =
        escapeHtml(
          item.link ||
          "#"
        );


      const image =
        item.image
          ? escapeHtml(
              String(
                item.image
              ).trim()
            )
          : "";


      let imageHtml = "";


      if (image) {

        imageHtml = `

          <img

            class="news-image"

            src="${image}"

            alt=""

            loading="lazy"

            referrerpolicy="no-referrer"

            onerror="
              this.outerHTML=
              '<div class=&quot;news-image no-image&quot;>📰</div>'
            "

          >

        `;

      }

      else {

        imageHtml = `

          <div class="news-image no-image">

            📰

          </div>

        `;

      }


      return `

        <a

          class="news-card"

          href="${link}"

          target="_blank"

          rel="noopener noreferrer"

        >

          ${imageHtml}


          <div class="news-content">


            <div class="source">

              ${sourceName}

            </div>


            <div class="news-title">

              ${title}

            </div>


            <div class="news-time">

              ${time}

            </div>


          </div>

        </a>

      `;

    }).join("");

}


/* =========================================================
   API'DEN HABERLER
========================================================= */

async function loadNews() {

  const container =
    document.getElementById(
      "news"
    );


  container.innerHTML = `

    <div class="loading">

      <div class="loading-icon">
        📰
      </div>

      Haberler yükleniyor...

    </div>

  `;


  try {

    const response =
      await fetch(
        "/api/news?cache=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "API hatası"
      );

    }


    const data =
      await response.json();


    if (
      !data.ok ||
      !Array.isArray(
        data.items
      )
    ) {

      throw new Error(
        "Haber verisi yok"
      );

    }


    allNews =
      data.items;


    renderFilters();

    renderNews();

  }


  catch (error) {

    console.error(
      "Haberler yüklenemedi:",
      error
    );


    container.innerHTML = `

      <div class="error">

        📰

        <br><br>

        Haberler şu anda yüklenemiyor.

        <br><br>

        Lütfen biraz sonra tekrar deneyin.

        <br><br>

        <button
          onclick="loadNews()"
        >

          ↻ Tekrar Dene

        </button>

      </div>

    `;

  }

}


/* =========================================================
   KAYNAK FİLTRELERİ
   (filtreler dinamik oluştuğu için tıklamayı
   sabit kapsayıcı üzerinden dinliyoruz)
========================================================= */

document
  .getElementById("filters")
  .addEventListener("click", event => {

    const button =
      event.target.closest(".filter");


    if (!button) return;


    document
      .querySelectorAll(".filter")
      .forEach(btn =>

        btn.classList.remove("active")

      );


    button.classList.add("active");


    currentSource =
      button.dataset.source;


    renderNews();

  });


/* =========================================================
   ARAMA KUTUSU
========================================================= */

const searchInput =
  document.getElementById("searchInput");

const clearButton =
  document.getElementById("clearSearch");


searchInput.addEventListener("input", () => {

  searchQuery =
    searchInput.value;


  clearButton.classList.toggle(
    "show",
    searchQuery.length > 0
  );


  renderNews();

});


clearButton.addEventListener("click", () => {

  searchInput.value = "";

  searchQuery = "";

  clearButton.classList.remove("show");

  renderNews();

  searchInput.focus();

});


/* =========================================================
   SAYFA AÇILINCA
========================================================= */

loadNews();

</script>
