<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#002b1d"
>

<title>Kocaeli Cepte - Haberler</title>


<style>

/* =========================================================
   KOCAELİ CEPTE
   HABERLER - YEŞİL TEMA
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #002b1d 0%,
      #003c29 45%,
      #002d20 100%
    );

  color: #f2f7f3;

  padding-bottom: 30px;

  min-height: 100vh;
}

a {
  text-decoration: none;
  color: inherit;

  -webkit-tap-highlight-color:
    transparent;
}


/* =========================================================
   ANA ALAN
========================================================= */

.header,
.back,
.page-title,
.filters,
.news {

  width: 100%;

  max-width: 800px;

  margin-left: auto;
  margin-right: auto;

}


/* =========================================================
   HEADER
========================================================= */

.header {

  padding:
    20px 18px 17px;

  display: flex;

  align-items: center;

  gap: 12px;

  background:
    linear-gradient(
      135deg,
      #004b32 0%,
      #00613e 55%,
      #00774a 100%
    );

  border-radius:
    0 0 24px 24px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.20);

  position: relative;

  overflow: hidden;
}

.header::after {

  content: "";

  position: absolute;

  width: 170px;
  height: 170px;

  right: -70px;
  top: -100px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.07);
}

.logo {

  width: 48px;
  height: 48px;

  flex-shrink: 0;

  border-radius: 14px;

  background:
    rgba(255,255,255,.13);

  border:
    1px solid
    rgba(255,255,255,.16);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 23px;

  position: relative;
  z-index: 2;

  box-shadow:
    0 6px 16px
    rgba(0,0,0,.15);
}

.header > div:last-child {

  position: relative;

  z-index: 2;
}

.brand {

  font-size: 21px;

  font-weight: 900;

  letter-spacing: -.4px;

  color: #ffffff;
}

.brand span {

  color: #35e86b;
}

.subtitle {

  color:
    rgba(255,255,255,.66);

  font-size: 9px;

  letter-spacing: 1.8px;

  margin-top: 5px;

  text-transform: uppercase;

  font-weight: 600;
}


/* =========================================================
   GERİ
========================================================= */

.back {

  padding:
    15px 18px 5px;
}

.back a {

  display: inline-flex;

  align-items: center;

  gap: 5px;

  color: #65d889;

  font-size: 12px;

  font-weight: 700;

  padding:
    6px 0;
}

.back a:active {

  transform:
    scale(.97);
}


/* =========================================================
   BAŞLIK
========================================================= */

.page-title {

  padding:
    8px 18px 15px;
}

.page-title h1 {

  font-size: 25px;

  line-height: 1.2;

  font-weight: 900;

  color: #ffffff;

  letter-spacing: -.5px;
}

.page-title p {

  color: #8db4a0;

  font-size: 11px;

  line-height: 1.45;

  margin-top: 6px;
}


/* =========================================================
   FİLTRELER
========================================================= */

.filters {

  display: flex;

  gap: 8px;

  overflow-x: auto;

  padding:
    0 18px 17px;

  scrollbar-width: none;
}

.filters::-webkit-scrollbar {
  display: none;
}

.filter {

  flex-shrink: 0;

  padding:
    8px 13px;

  border-radius: 20px;

  background:
    #063b29;

  border:
    1px solid
    #15543b;

  color: #9dbbab;

  font-size: 10px;

  font-weight: 700;

  cursor: pointer;

  transition: .2s;
}

.filter:active {

  transform:
    scale(.96);
}

.filter.active {

  background:
    linear-gradient(
      135deg,
      #00d95b,
      #21ed68
    );

  color:
    #002711;

  border-color:
    #21ed68;

  font-weight: 900;

  box-shadow:
    0 5px 14px
    rgba(0,220,80,.18);
}


/* =========================================================
   HABERLER
========================================================= */

.news {

  padding:
    0 18px;
}

.news-card {

  display: flex;

  gap: 12px;

  background:
    linear-gradient(
      145deg,
      #063c2a,
      #043323
    );

  border:
    1px solid
    #15523a;

  border-radius: 17px;

  padding: 10px;

  margin-bottom: 10px;

  overflow: hidden;

  box-shadow:
    0 6px 18px
    rgba(0,0,0,.13);

  transition:
    transform .18s,
    border-color .18s;
}

.news-card:active {

  transform:
    scale(.985);

  border-color:
    #23704d;
}


/* =========================================================
   HABER RESMİ
========================================================= */

.news-image {

  width: 108px;

  height: 88px;

  flex-shrink: 0;

  border-radius: 12px;

  object-fit: cover;

  display: block;

  background:
    linear-gradient(
      135deg,
      #0b4932,
      #063523
    );
}


/* =========================================================
   RESİM YOKSA
========================================================= */

.news-image.no-image {

  display: flex;

  align-items: center;

  justify-content: center;

  color:
    #47735b;

  font-size: 25px;
}


/* =========================================================
   HABER İÇERİĞİ
========================================================= */

.news-content {

  min-width: 0;

  flex: 1;

  display: flex;

  flex-direction: column;

  justify-content: center;
}

.source {

  display: inline-block;

  width: fit-content;

  color:
    #32e86b;

  font-size: 9px;

  font-weight: 900;

  margin-bottom: 5px;

  text-transform: uppercase;

  letter-spacing: .2px;
}

.news-title {

  color:
    #edf7f0;

  font-size: 13px;

  line-height: 1.38;

  font-weight: 750;

  display: -webkit-box;

  -webkit-line-clamp: 3;

  -webkit-box-orient: vertical;

  overflow: hidden;
}

.news-time {

  color:
    #7fa591;

  font-size: 9px;

  margin-top: 6px;
}


/* =========================================================
   YÜKLENİYOR / BOŞ / HATA
========================================================= */

.loading,
.empty,
.error {

  text-align: center;

  padding:
    45px 15px;

  color:
    #83a894;

  font-size: 12px;
}

.loading-icon {

  font-size: 28px;

  margin-bottom: 8px;
}


/* =========================================================
   HATA BUTONU
========================================================= */

.error button {

  border: 0 !important;

  background:
    linear-gradient(
      135deg,
      #00d95b,
      #21e967
    ) !important;

  color:
    #002711 !important;

  padding:
    9px 15px !important;

  border-radius:
    10px !important;

  font-weight:
    900 !important;

  cursor:
    pointer;

  box-shadow:
    0 5px 15px
    rgba(0,220,80,.16);
}


/* =========================================================
   MOBİL
========================================================= */

@media (max-width: 420px) {

  .header {

    padding:
      18px 16px 16px;
  }

  .back {

    padding:
      14px 16px 5px;
  }

  .page-title {

    padding:
      8px 16px 14px;
  }

  .page-title h1 {

    font-size: 24px;
  }

  .filters {

    padding-left: 16px;
    padding-right: 16px;
  }

  .news {

    padding:
      0 16px;
  }

  .news-image {

    width: 105px;

    height: 85px;
  }

  .news-title {

    font-size: 13px;
  }

}


/* =========================================================
   KÜÇÜK TELEFON
========================================================= */

@media (max-width: 360px) {

  .news {

    padding:
      0 12px;
  }

  .filters {

    padding-left: 12px;
    padding-right: 12px;
  }

  .news-image {

    width: 96px;

    height: 80px;
  }

  .news-title {

    font-size: 12px;
  }

  .source {

    font-size: 8px;
  }

}


/* =========================================================
   MASAÜSTÜ
========================================================= */

@media (min-width: 700px) {

  body {

    padding-bottom: 40px;
  }

  .header {

    border-radius:
      0 0 25px 25px;
  }

  .news-card {

    padding:
      12px;
  }

  .news-image {

    width: 125px;

    height: 95px;
  }

  .news-title {

    font-size: 14px;
  }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<div class="header">

  <div class="logo">
    🏙️
  </div>

  <div>

    <div class="brand">
      KOCAELİ <span>CEPTE</span>
    </div>

    <div class="subtitle">
      Şehrin cepteki hali
    </div>

  </div>

</div>


<!-- =======================================================
     GERİ
======================================================= -->

<div class="back">

  <a href="index.html">

    ← Ana Sayfaya Dön

  </a>

</div>


<!-- =======================================================
     BAŞLIK
======================================================= -->

<div class="page-title">

  <h1>
    📰 Kocaeli Haberleri
  </h1>

  <p>
    Kocaeli'nin farklı haber kaynaklarından güncel haberler
  </p>

</div>


<!-- =======================================================
     FİLTRELER
======================================================= -->

<div class="filters">

  <div
    class="filter active"
    data-source="Tümü"
  >
    Tümü
  </div>

  <div
    class="filter"
    data-source="Kocaeli Gazetesi"
  >
    Kocaeli Gazetesi
  </div>

  <div
    class="filter"
    data-source="Özgür Kocaeli"
  >
    Özgür Kocaeli
  </div>

  <div
    class="filter"
    data-source="Ses Kocaeli"
  >
    Ses Kocaeli
  </div>

  <div
    class="filter"
    data-source="En Kocaeli"
  >
    En Kocaeli
  </div>

  <div
    class="filter"
    data-source="Kocaeli Gündem"
  >
    Kocaeli Gündem
  </div>

</div>


<!-- =======================================================
     HABERLER
======================================================= -->

<div
  class="news"
  id="news"
>

  <div class="loading">

    <div class="loading-icon">
      📰
    </div>

    Haberler yükleniyor...

  </div>

</div>


<script>

/* =========================================================
   HABERLER
========================================================= */

let allNews = [];


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function escapeHtml(str) {

  if (!str) return "";

  return String(str)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =========================================================
   HABERLERİ GÖSTER
========================================================= */

function renderNews(source = "Tümü") {

  const container =
    document.getElementById("news");


  let news =
    allNews;


  if (source !== "Tümü") {

    news =
      allNews.filter(item =>

        String(
          item.source || ""
        ).trim() === source

      );

  }


  if (!news.length) {

    container.innerHTML = `

      <div class="empty">

        📰

        <br><br>

        Bu kaynakta şu anda haber bulunamadı.

      </div>

    `;

    return;

  }


  container.innerHTML =

    news.map(item => {

      const title =
        escapeHtml(
          item.title ||
          "Başlıksız haber"
        );


      const sourceName =
        escapeHtml(
          item.source ||
          "Kocaeli"
        );


      const time =
        escapeHtml(
          item.time ||
          ""
        );


      const link =
        escapeHtml(
          item.link ||
          "#"
        );


      const image =
        item.image
          ? escapeHtml(
              String(
                item.image
              ).trim()
            )
          : "";


      let imageHtml = "";


      if (image) {

        imageHtml = `

          <img

            class="news-image"

            src="${image}"

            alt=""

            loading="lazy"

            referrerpolicy="no-referrer"

            onerror="
              this.outerHTML=
              '<div class=&quot;news-image no-image&quot;>📰</div>'
            "

          >

        `;

      }

      else {

        imageHtml = `

          <div class="news-image no-image">

            📰

          </div>

        `;

      }


      return `

        <a

          class="news-card"

          href="${link}"

          target="_blank"

          rel="noopener noreferrer"

        >

          ${imageHtml}


          <div class="news-content">


            <div class="source">

              ${sourceName}

            </div>


            <div class="news-title">

              ${title}

            </div>


            <div class="news-time">

              ${time}

            </div>


          </div>

        </a>

      `;

    }).join("");

}


/* =========================================================
   API'DEN HABERLER
========================================================= */

async function loadNews() {

  const container =
    document.getElementById(
      "news"
    );


  container.innerHTML = `

    <div class="loading">

      <div class="loading-icon">
        📰
      </div>

      Haberler yükleniyor...

    </div>

  `;


  try {

    const response =
      await fetch(
        "/api/news?cache=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "API hatası"
      );

    }


    const data =
      await response.json();


    if (
      !data.ok ||
      !Array.isArray(
        data.items
      )
    ) {

      throw new Error(
        "Haber verisi yok"
      );

    }


    allNews =
      data.items;


    renderNews();

  }


  catch (error) {

    console.error(
      "Haberler yüklenemedi:",
      error
    );


    container.innerHTML = `

      <div class="error">

        📰

        <br><br>

        Haberler şu anda yüklenemiyor.

        <br><br>

        Lütfen biraz sonra tekrar deneyin.

        <br><br>

        <button
          onclick="loadNews()"
        >

          ↻ Tekrar Dene

        </button>

      </div>

    `;

  }

}


/* =========================================================
   KAYNAK FİLTRELERİ
========================================================= */

document
  .querySelectorAll(".filter")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(
            ".filter"
          )
          .forEach(btn =>

            btn.classList.remove(
              "active"
            )

          );


        button.classList.add(
          "active"
        );


        renderNews(
          button.dataset.source
        );

      }
    );

  });


/* =========================================================
   SAYFA AÇILINCA
========================================================= */

loadNews();

</script>

</body>

</html>
