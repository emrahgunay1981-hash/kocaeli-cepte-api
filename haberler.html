<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kocaeli Cepte - Haberler</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, "Segoe UI", Arial, sans-serif;
  background: #0b1710;
  color: #f2f5f2;
  padding-bottom: 30px;
}

a {
  color: inherit;
  text-decoration: none;
}

.header {
  padding: 20px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid #1c3826;
}

.back {
  font-size: 28px;
  color: #34c759;
}

.title {
  font-size: 20px;
  font-weight: 800;
}

.subtitle {
  font-size: 10px;
  color: #7f9b87;
  letter-spacing: 1px;
  margin-top: 3px;
}

.container {
  padding: 18px 16px;
}

.news-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.news-card {
  display: block;
  background: #10241a;
  border: 1px solid #1c3826;
  border-radius: 15px;
  padding: 15px;
}

.news-card h2 {
  font-size: 16px;
  line-height: 1.35;
  margin-bottom: 8px;
}

.news-card .time {
  font-size: 11px;
  color: #7f9b87;
}

.source {
  display: inline-block;
  margin-top: 8px;
  font-size: 9px;
  color: #34c759;
  background: #16301f;
  padding: 4px 7px;
  border-radius: 5px;
}

.loading {
  text-align: center;
  padding: 40px 10px;
  color: #7f9b87;
}

.loading span {
  display: block;
  font-size: 30px;
  margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="header">

  <a href="index.html" class="back">
    ‹
  </a>

  <div>
    <div class="title">
      Kocaeli Haberleri
    </div>

    <div class="subtitle">
      KOCAELİ CEPTE
    </div>
  </div>

</div>


<div class="container">

  <div id="news-list" class="news-list">

    <div class="loading">
      <span>📰</span>
      Kocaeli haberleri yükleniyor...
    </div>

  </div>

</div>


<script>

function escapeHtml(str) {

  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


fetch("/api/news")

  .then(response => response.json())

  .then(data => {

    const list =
      document.getElementById("news-list");

    if (
      !data.ok ||
      !data.items ||
      data.items.length === 0
    ) {

      list.innerHTML = `
        <div class="loading">
          <span>📰</span>
          Haber bulunamadı.
        </div>
      `;

      return;
    }


    list.innerHTML =
      data.items.map(item => `

        <a
          href="${item.link}"
          target="_blank"
          rel="noopener noreferrer"
          class="news-card"
        >

          <h2>
            ${escapeHtml(item.title)}
          </h2>

          <div class="time">
            ${escapeHtml(item.time || "")}
          </div>

          <div class="source">
            KOCAELİ CEPTE
          </div>

        </a>

      `).join("");

  })

  .catch(() => {

    document.getElementById("news-list").innerHTML = `

      <div class="loading">

        <span>⚠️</span>

        Haberler şu anda yüklenemiyor.

      </div>

    `;

  });

</script>

</body>
</html>
