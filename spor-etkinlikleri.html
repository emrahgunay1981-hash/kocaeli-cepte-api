<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#078897">

<title>Kocaeli Cepte - Spor Etkinlikleri</title>
<meta
  name="description"
  content="Kocaeli'deki voleybol, basketbol ve diğer spor salonu etkinlikleri."
>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    background: #061B35;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

    background:
        radial-gradient(
            circle at top,
            #0b4665 0%,
            #082f50 35%,
            #061B35 75%,
            #04152a 100%
        );

    color: #f5faff;
    min-height: 100vh;
    padding-bottom: 30px;
}

a {
    text-decoration: none;
    color: inherit;
}


/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;

    background:
        linear-gradient(
            135deg,
            rgba(7,92,115,0.98),
            rgba(5,54,82,0.98)
        );

    padding: 17px 16px 15px;

    border-bottom: 1px solid rgba(56,232,245,0.18);

    box-shadow:
        0 6px 22px rgba(0,0,0,0.28);
}

.header-inner {
    max-width: 800px;
    margin: auto;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-icon {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            #00cfe8,
            #078897
        );

    border: 1px solid rgba(56,232,245,0.35);

    font-size: 21px;

    box-shadow:
        0 5px 16px rgba(0,0,0,0.22);
}

.header h1 {
    font-size: 21px;
    font-weight: 800;
    line-height: 1.1;
}

.header-subtitle {
    color: #9dd5df;
    font-size: 10px;
    margin-top: 4px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
}

.back {
    display: inline-flex;
    align-items: center;

    margin-top: 12px;

    color: #a9dce5;

    font-size: 12px;
    font-weight: 600;
}

.back:active {
    transform: translateX(-3px);
}


/* =========================
   CONTAINER
========================= */

.container {
    max-width: 800px;
    margin: auto;
    padding: 18px 16px 30px;
}

.intro {
    background:
        linear-gradient(135deg, rgba(0,207,232,.96), rgba(7,136,151,.96));
    border-radius: 17px;
    padding: 17px 18px;
    margin-bottom: 18px;
    color: #e9fcff;
    font-size: 13px;
    line-height: 1.6;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
}


/* =========================
   DURUM
========================= */

.status {
    text-align: center;
    padding: 28px 10px;
    color: #9db7cc;
    font-size: 13px;
}


/* =========================
   ETKİNLİK KARTLARI
========================= */

.event {
    position: relative;
    background:
        linear-gradient(
            145deg,
            rgba(10,41,72,0.98),
            rgba(7,32,57,0.99)
        );
    border: 1px solid #174566;
    border-radius: 17px;
    padding: 17px;
    margin-bottom: 12px;
    box-shadow:
        0 7px 24px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.025);
}

.event h2 {
    margin: 0 0 11px;
    color: #f5fbff;
    font-size: 17px;
    line-height: 1.3;
    font-weight: 800;
}

.event p {
    margin: 8px 0;
    color: #b8ccda;
    font-size: 12px;
    line-height: 1.5;
}

.event p:first-of-type {
    color: #71dce8;
    font-weight: 600;
}

.event a.event-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
    padding: 10px 14px;
    background:
        linear-gradient(135deg, #00cfe8, #078897);
    color: #021b2c;
    text-decoration: none;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 5px 16px rgba(0,207,232,0.18);
}

.event a.event-link:active {
    transform: scale(0.97);
}


/* =========================
   BOŞ DURUM
========================= */

.empty {
    text-align: center;
    padding: 40px 15px;
    color: #8eacbf;
    font-size: 13px;
    line-height: 1.7;
    background: rgba(7,35,61,0.65);
    border: 1px solid #17435f;
    border-radius: 16px;
}

.empty a {
    color: #38e8f5;
    font-weight: 700;
}


/* =========================
   HATA
========================= */

.api-error {
    color: #ffc1c1;
    background: rgba(73,27,35,0.82);
    border: 1px solid #783742;
    border-radius: 15px;
    padding: 18px;
    line-height: 1.5;
}

</style>

</head>


<body>


<div class="header">

    <div class="header-inner">

        <div class="header-title">

            <div class="header-icon">🏐</div>

            <div>
                <h1>Spor Etkinlikleri</h1>
                <div class="header-subtitle">Voleybol, basketbol ve daha fazlası</div>
            </div>

        </div>

        <a class="back" href="etkinlikler.html">
            ← Etkinliklere Dön
        </a>

    </div>

</div>


<div class="container">

    <div class="intro">
        🏐🏀 Kocaeli'deki voleybol, basketbol ve diğer spor salonu etkinlikleri; belediye ve şehir etkinlik kaynaklarından otomatik olarak derlenir.
    </div>

    <div id="status" class="status">
        Spor etkinlikleri yükleniyor...
    </div>

    <div id="events"></div>

</div>


<script>

function escapeHtml(str) {
    if (!str) return "";
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

const SPORT_KEYWORDS = [
    "voleybol", "basketbol", "hentbol", "spor salonu",
    "futsal", "masa tenisi", "güreş", "judo", "taekwondo"
];

async function sporEtkinlikleriGetir() {

    const status = document.getElementById("status");
    const eventsDiv = document.getElementById("events");

    try {

        const response = await fetch(
            "https://kocaeli-cepte-api.vercel.app/api/etkinlikler?cache=" + Date.now()
        );

        if (!response.ok) throw new Error("API bağlantısı başarısız");

        const data = await response.json();

        if (!data.success || !Array.isArray(data.events)) {
            throw new Error("Veri alınamadı");
        }

        const sportEvents = data.events.filter(event => {
            const text = (
                (event.title || "") + " " + (event.description || "")
            ).toLocaleLowerCase("tr-TR");

            return SPORT_KEYWORDS.some(keyword => text.includes(keyword));
        });

        status.style.display = "none";

        if (sportEvents.length === 0) {
            eventsDiv.innerHTML = `
                <div class="empty">
                    🏐<br><br>
                    Şu anda listelenen bir spor etkinliği bulunamadı.
                    <br><br>
                    Tüm etkinlikler için <a href="etkinlikler.html">Etkinlikler sayfasına</a> göz atabilirsiniz.
                </div>
            `;
            return;
        }

        eventsDiv.innerHTML = sportEvents.map(event => {

            const title = escapeHtml(event.title || "Spor Etkinliği");
            const date = escapeHtml(event.date || "");
            const location = escapeHtml(event.location || "");
            const description = escapeHtml(event.description || "");
            const url = escapeHtml(event.url || "");

            return `
                <div class="event">
                    <h2>${title}</h2>
                    ${date ? `<p>📅 ${date}</p>` : ""}
                    ${location ? `<p>📍 ${location}</p>` : ""}
                    ${description ? `<p>${description}</p>` : ""}
                    ${url ? `<a class="event-link" href="${url}" target="_blank" rel="noopener">Etkinlik Detayları →</a>` : ""}
                </div>
            `;

        }).join("");

    } catch (error) {

        console.error("SPOR ETKİNLİK HATASI:", error);

        status.style.display = "block";
        status.innerHTML = `
            <div class="api-error">
                ❌ Spor etkinlikleri şu anda yüklenemedi.
                <br><br>
                Lütfen daha sonra tekrar deneyin.
            </div>
        `;

    }

}

sporEtkinlikleriGetir();

</script>


</body>
</html>
