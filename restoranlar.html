<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kocaeli Cepte - Restoranlar</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

.header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #0d241a;
    padding: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
}

.header h1 {
    margin: 0;
    font-size: 22px;
}

.back {
    display: inline-block;
    margin-top: 8px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
}

.container {
    padding: 16px;
    max-width: 800px;
    margin: auto;
}

select {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0d241a;
    color: white;
    font-size: 15px;
    margin-bottom: 16px;
}

.status {
    text-align: center;
    padding: 25px 10px;
    color: #bbb;
}

.card {
    background: #102033;
    border: 1px solid #1d354d;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    background: #1d354d;
}

.card-body {
    padding: 14px 16px;
}

.card-name {
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 6px;
}

.card-address {
    color: #aeb8c4;
    font-size: 13px;
    margin-bottom: 10px;
    line-height: 1.4;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
}

.badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
}

.badge-google {
    background: #1a3a2a;
    color: #4ade80;
}

.badge-open {
    background: #1a3a2a;
    color: #4ade80;
}

.badge-closed {
    background: #3a1a1a;
    color: #f87171;
}

.badge-price {
    background: #1d354d;
    color: #9cc4ff;
}

.our-rating {
    border-top: 1px solid #1d354d;
    padding-top: 10px;
    margin-top: 4px;
}

.our-rating-label {
    font-size: 12px;
    color: #8a97a8;
    margin-bottom: 6px;
}

.stars {
    display: flex;
    gap: 4px;
    font-size: 24px;
    cursor: pointer;
    user-select: none;
}

.star {
    color: #3a4a5c;
}

.star.filled {
    color: #ffc107;
}

.error {
    background: #32151a;
    color: #ffb4b4;
    padding: 14px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="header">
    <h1>🍽️ Kocaeli Restoranları</h1>
    <a class="back" href="index.html">← Kocaeli Cepte'ye Dön</a>
</div>

<div class="container">

    <select id="district">
        <option value="Kocaeli">Kocaeli - Tüm İlçeler</option>
        <option value="İzmit">İzmit</option>
        <option value="Gebze">Gebze</option>
        <option value="Darıca">Darıca</option>
        <option value="Körfez">Körfez</option>
        <option value="Başiskele">Başiskele</option>
        <option value="Kartepe">Kartepe</option>
        <option value="Gölcük">Gölcük</option>
        <option value="Derince">Derince</option>
        <option value="Çayırova">Çayırova</option>
        <option value="Dilovası">Dilovası</option>
        <option value="Kandıra">Kandıra</option>
        <option value="Karamürsel">Karamürsel</option>
    </select>

    <div id="status" class="status">
        Restoranlar yükleniyor...
    </div>

    <div id="restaurants"></div>

</div>

<script>

const district = document.getElementById("district");
const status = document.getElementById("status");
const restaurantsDiv = document.getElementById("restaurants");

const priceLevelMap = {
    "PRICE_LEVEL_FREE": "Ücretsiz",
    "PRICE_LEVEL_INEXPENSIVE": "₺",
    "PRICE_LEVEL_MODERATE": "₺₺",
    "PRICE_LEVEL_EXPENSIVE": "₺₺₺",
    "PRICE_LEVEL_VERY_EXPENSIVE": "₺₺₺₺"
};

function starsHtml(placeId, currentRating) {

    let html = '<div class="stars" data-place-id="' + placeId + '">';

    for (let i = 1; i <= 5; i++) {
        const filled = i <= currentRating ? "filled" : "";
        html += '<span class="star ' + filled + '" data-value="' + i + '">★</span>';
    }

    html += '</div>';

    return html;
}

async function restoranlariGetir() {

    status.style.display = "block";
    status.textContent = "Restoranlar yükleniyor...";
    restaurantsDiv.innerHTML = "";

    try {

        const response = await fetch(
            "https://kocaeli-cepte-api.vercel.app/api/restoranlar?ilce=" +
            encodeURIComponent(district.value)
        );

        if (!response.ok) {
            const errBody = await response.text();
            throw new Error(
                "HTTP " + response.status + " — " + errBody.slice(0, 500)
            );
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.error || "Bilinmeyen hata");
        }

        status.style.display = "none";

        if (!data.restaurants || data.restaurants.length === 0) {
            restaurantsDiv.innerHTML = '<div class="status">Bu bölgede restoran bulunamadı.</div>';
            return;
        }

        restaurantsDiv.innerHTML = data.restaurants.map(r => {

            const priceText = r.priceLevel ? priceLevelMap[r.priceLevel] || "" : "";

            const openBadge = r.openNow === true
                ? '<span class="badge badge-open">Açık</span>'
                : r.openNow === false
                ? '<span class="badge badge-closed">Kapalı</span>'
                : '';

            const ratingBadge = r.rating
                ? '<span class="badge badge-google">⭐ ' + r.rating + ' (' + r.ratingCount + ')</span>'
                : '';

            const priceBadge = priceText
                ? '<span class="badge badge-price">' + priceText + '</span>'
                : '';

            const mapsUrl = "https://www.google.com/maps/search/?api=1&query=" +
                encodeURIComponent(r.name + " " + r.address) +
                "&query_place_id=" + r.id;

            const imgHtml = r.photoUrl
                ? '<img src="' + r.photoUrl + '" alt="' + r.name + '">'
                : '';

            return `
                <div class="card">
                    <a href="${mapsUrl}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;">
                        ${imgHtml}
                        <div class="card-body">
                            <div class="card-name">${r.name}</div>
                            <div class="card-address">📍 ${r.address}</div>
                            <div class="badges">
                                ${ratingBadge}
                                ${priceBadge}
                                ${openBadge}
                            </div>
                        </div>
                    </a>
                    <div class="card-body" style="padding-top:0;">
                        <div class="our-rating">
                            <div class="our-rating-label" data-label-for="${r.id}">Kocaeli Cepte Puanı</div>
                            ${starsHtml(r.id, 0)}
                        </div>
                    </div>
                </div>
            `;

        }).join("");

        // Kayıtlı puanları çek ve göster
        try {

            const placeIds = data.restaurants.map(r => r.id).join(",");

            const ratingsResponse = await fetch(
                "https://kocaeli-cepte-api.vercel.app/api/puan?placeIds=" +
                encodeURIComponent(placeIds)
            );

            if (ratingsResponse.ok) {

                const ratingsData = await ratingsResponse.json();

                if (ratingsData.success) {

                    Object.keys(ratingsData.ratings).forEach(placeId => {

                        const info = ratingsData.ratings[placeId];
                        const label = document.querySelector('[data-label-for="' + placeId + '"]');
                        const starGroup = document.querySelector('.stars[data-place-id="' + placeId + '"]');

                        if (label) {
                            label.textContent = info.count > 0
                                ? "Kocaeli Cepte Puanı: " + info.average + " (" + info.count + " oy)"
                                : "Kocaeli Cepte Puanı (henüz oy yok)";
                        }

                        if (starGroup && info.count > 0) {
                            const stars = starGroup.querySelectorAll(".star");
                            const rounded = Math.round(info.average);
                            stars.forEach((star, index) => {
                                star.classList.toggle("filled", index < rounded);
                            });
                        }

                    });

                }

            }

        } catch (ratingError) {
            console.error("Puanlar getirilemedi:", ratingError);
        }

        // Yıldızlara tıklama etkileşimi - artık gerçekten kaydediyor
        // ve cihaz başına (localStorage) sadece 1 kez oy vermeye izin veriyor
        document.querySelectorAll(".stars").forEach(starGroup => {

            const placeId = starGroup.dataset.placeId;
            const votedKey = "oy_verildi_" + placeId;
            const label = document.querySelector('[data-label-for="' + placeId + '"]');

            // Sayfa yüklenirken, daha önce oy verilmişse göster
            const previousVote = localStorage.getItem(votedKey);

            if (previousVote) {

                const stars = starGroup.querySelectorAll(".star");
                stars.forEach((star, index) => {
                    star.classList.toggle("filled", index < parseInt(previousVote));
                });

                starGroup.style.opacity = "0.6";
                starGroup.style.pointerEvents = "none";

                if (label) {
                    const currentText = label.textContent;
                    label.textContent = currentText + " (Bu restorana oy verdiniz)";
                }

            }

            starGroup.addEventListener("click", async (e) => {
                if (!e.target.classList.contains("star")) return;

                // Zaten oy verilmişse hiçbir şey yapma
                if (localStorage.getItem(votedKey)) return;

                const value = parseInt(e.target.dataset.value);
                const stars = starGroup.querySelectorAll(".star");

                // Önce görsel olarak göster
                stars.forEach((star, index) => {
                    star.classList.toggle("filled", index < value);
                });

                if (label) {
                    label.textContent = "Kaydediliyor...";
                }

                try {

                    const saveResponse = await fetch(
                        "https://kocaeli-cepte-api.vercel.app/api/puan",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ placeId, rating: value })
                        }
                    );

                    const saveData = await saveResponse.json();

                    if (saveData.success && label) {

                        // Bu cihazın bu restorana oy verdiğini kaydet
                        localStorage.setItem(votedKey, value);

                        label.textContent =
                            "Kocaeli Cepte Puanı: " + saveData.average +
                            " (" + saveData.count + " oy) — Teşekkürler!";

                        starGroup.style.opacity = "0.6";
                        starGroup.style.pointerEvents = "none";

                    } else if (label) {
                        label.textContent = "Puan kaydedilemedi, tekrar deneyin.";
                    }

                } catch (err) {
                    console.error("Puan kaydetme hatası:", err);
                    if (label) {
                        label.textContent = "Puan kaydedilemedi, tekrar deneyin.";
                    }
                }

            });
        });

    } catch (error) {

        console.error("RESTORAN API HATASI:", error);

        status.style.display = "block";

        status.innerHTML = `
            <div class="error">
                ❌ Restoranlar yüklenemedi.
                <br><br>
                <strong>Hata:</strong> ${error.message || error}
            </div>
        `;

    }

}

district.addEventListener("change", restoranlariGetir);

restoranlariGetir();

</script>

</body>
</html>
