<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kocaeli Cepte - Kocaelispor Haberleri</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071b12;
    color: white;
    padding-bottom: 80px;
}

.header {
    background: linear-gradient(135deg, #008b45, #005b2d);
    padding: 22px 18px;
}

.header-top {
    display: flex;
    align-items: center;
    gap: 12px;
}

.back {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.18);
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-size: 24px;
}

.logo {
    font-size: 30px;
    font-weight: 900;
}

.header h1 {
    margin: 5px 0 0 52px;
    font-size: 20px;
}

.subtitle {
    margin: 5px 0 0 52px;
    font-size: 13px;
    opacity: .9;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 18px;
}

.section-title {
    margin: 5px 0 14px;
    font-size: 21px;
}

.news-card {
    background: #10281d;
    border: 1px solid #1b4a34;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
}

.news-title {
    font-size: 17px;
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 9px;
}

.news-date {
    color: #7fae96;
    font-size: 12px;
    margin-bottom: 9px;
}

.news-description {
    color: #cbd5e1;
    font-size: 14px;
    line-height: 1.5;
}

.news-button {
    display: inline-block;
    margin-top: 12px;
    padding: 9px 14px;
    border-radius: 9px;
    background: #008b45;
    color: white;
    text-decoration: none;
    font-size: 13px;
}

.status {
    text-align: center;
    color: #aaa;
    padding: 35px 10px;
}

.error {
    color: #ff7777;
    text-align: center;
    line-height: 1.6;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #06140d;
    border-top: 1px solid #1b4a34;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 20;
}

.nav-item {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    text-decoration: none;
}

.nav-item.active {
    color: #39d67d;
}

.nav-icon {
    font-size: 23px;
    display: block;
    margin-bottom: 3px;
}

</style>
</head>

<body>

<header class="header">

    <div class="header-top">

        <a class="back" href="index.html">
            ←
        </a>

        <div class="logo">
            41
        </div>

    </div>

    <h1>
        KOCAELİSPOR
    </h1>

    <div class="subtitle">
        Kocaelispor'dan son gelişmeler
    </div>

</header>


<main class="container">

    <h2 class="section-title">
        🟢 Kocaelispor Haberleri
    </h2>

    <div id="status" class="status">
        Haberler yükleniyor...
    </div>

    <div id="news"></div>

</main>


<nav class="bottom-nav">

    <a href="index.html" class="nav-item">

        <span class="nav-icon">🏠</span>
        Ana Sayfa

    </a>

    <a href="haberler.html" class="nav-item">

        <span class="nav-icon">📰</span>
        Haberler

    </a>

    <a href="sport.html" class="nav-item active">

        <span class="nav-icon">⚽</span>
        Kocaelispor

    </a>

    <a href="ulasim.html" class="nav-item">

        <span class="nav-icon">🚌</span>
        Ulaşım

    </a>

</nav>


<script>

async function kocaelisporHaberleriniGetir() {

    const status = document.getElementById("status");
    const newsDiv = document.getElementById("news");

    try {

        /*
         * Kocaelispor haber API'si
         */

        const response = await fetch(
            "https://kocaeli-cepte-api.vercel.app/api/kocaelispor"
        );

        if (!response.ok) {
            throw new Error("Kocaelispor haber API bağlantısı başarısız");
        }

        const data = await response.json();

        if (!data.items || data.items.length === 0) {

            status.innerHTML = `
                <div class="status">
                    Şu anda Kocaelispor haberi bulunamadı.
                </div>
            `;

            return;
        }

        status.style.display = "none";


        newsDiv.innerHTML = data.items.map(item => `

            <article class="news-card">

                <div class="news-title">
                    ${item.title || "Kocaelispor Haberi"}
                </div>

                ${
                    item.date
                    ? `
                        <div class="news-date">
                            📅 ${item.date}
                        </div>
                    `
                    : ""
                }

                ${
                    item.description
                    ? `
                        <div class="news-description">
                            ${item.description}
                        </div>
                    `
                    : ""
                }

                ${
                    item.url
                    ? `
                        <a
                            class="news-button"
                            href="${item.url}"
                            target="_blank"
                            rel="noopener"
                        >
                            Haberi Oku →
                        </a>
                    `
                    : ""
                }

            </article>

        `).join("");


    } catch (error) {

        console.error(
            "KOCAELİSPOR HABER API HATASI:",
            error
        );

        status.innerHTML = `
            <div class="error">

                ❌ Kocaelispor haberleri yüklenemedi.

                <br><br>

                API bağlantısı kontrol ediliyor...

            </div>
        `;

    }

}


kocaelisporHaberleriniGetir();

</script>

</body>
</html>
