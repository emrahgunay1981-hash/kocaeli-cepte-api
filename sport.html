<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002b1d">
  <title>Kocaelispor Haberleri | Kocaeli Cepte</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: #001f15;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top, #06452f 0%, #002f20 38%, #001f15 100%);
      color: #f2f7f4;
      padding-bottom: 85px;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 0 14px 25px;
    }

    /* =========================
       KOCAELİSPOR HERO
    ========================== */

    .hero {
      position: relative;
      width: calc(100% + 28px);
      margin-left: -14px;
      height: 560px;
      overflow: hidden;
      background: #00150d;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.35);
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: saturate(1.3) contrast(1.1);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.08) 0%,
          rgba(0,15,9,0.12) 35%,
          rgba(0,18,11,0.48) 58%,
          rgba(0,15,9,0.96) 100%
        );
    }

    /* ÜST ROZET */

    .hero-badge {
      position: absolute;
      top: 20px;
      right: 18px;
      z-index: 10;
      padding: 8px 12px;
      border-radius: 20px;
      background: rgba(0,55,36,0.82);
      border: 1px solid rgba(53,232,107,0.35);
      backdrop-filter: blur(8px);
      color: #bfffd2;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* GERİ BUTONU */

    .back-button {
      position: absolute;
      top: 20px;
      left: 18px;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(0,55,36,0.84);
      border: 1px solid rgba(53,232,107,0.38);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 31px;
      line-height: 1;
      z-index: 10;
      backdrop-filter: blur(8px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .back-button:active {
      transform: scale(0.95);
    }

    .hero-content {
      position: absolute;
      left: 24px;
      right: 20px;
      bottom: 34px;
      z-index: 5;
    }

    .hero-title {
      margin: 0;
      font-size: 39px;
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: -1.5px;
      text-transform: uppercase;
    }

    .hero-title .kocaelispor {
      display: block;
      color: #35e86b;
      text-shadow:
        0 2px 8px rgba(0,0,0,0.85),
        0 0 18px rgba(53,232,107,0.18);
    }

    .hero-title .haberleri-wrap {
      position: relative;
      display: inline-block;
      margin-top: 7px;
      padding: 5px 18px 8px 10px;
      z-index: 1;
    }

    .hero-title .haberleri-wrap::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: -14px;
      right: -20px;
      top: 2px;
      bottom: 0;
      background: linear-gradient(
        135deg,
        #16d95d,
        #35e86b
      );
      transform: skewX(-8deg);
      border-radius: 5px;
      box-shadow:
        -7px 5px 0 rgba(53,232,107,0.45),
        7px -3px 0 rgba(53,232,107,0.22);
    }

    .hero-title .haberleri {
      display: block;
      color: #00170d;
      position: relative;
      z-index: 2;
      text-shadow: none;
    }

    .hero-line {
      width: 58px;
      height: 4px;
      background: #35e86b;
      margin: 18px 0 13px;
      border-radius: 5px;
      box-shadow: 0 0 12px rgba(53,232,107,0.35);
    }

    .hero-slogan {
      font-size: 13px;
      letter-spacing: 3.5px;
      font-weight: 800;
      color: #f2fff6;
      text-transform: uppercase;
      text-shadow: 0 2px 7px rgba(0,0,0,0.85);
    }

    /* =========================
       DURUM
    ========================== */

    #status {
      text-align: center;
      padding: 28px 10px;
      color: #9fc8b0;
      font-size: 13px;
    }

    /* =========================
       HABER KARTLARI
    ========================== */

    #news {
      margin-top: 4px;
    }

    .news-card {
      background:
        linear-gradient(
          145deg,
          rgba(6,60,42,0.96),
          rgba(3,43,30,0.98)
        );
      border: 1px solid #17583d;
      border-radius: 17px;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow:
        0 8px 24px rgba(0,0,0,0.24),
        inset 0 1px 0 rgba(255,255,255,0.025);
    }

    .news-card:active {
      transform: scale(0.992);
    }

    .news-image {
      width: 100%;
      height: 205px;
      object-fit: cover;
      display: block;
      background: #0b3022;
    }

    .news-content {
      padding: 16px;
    }

    .news-title {
      color: #f4fff7;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .news-date,
    .news-source {
      color: #86b99d;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .news-description {
      color: #c5d9cd;
      font-size: 13px;
      line-height: 1.55;
      margin: 9px 0 13px;
    }

    .news-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #0cc953,
          #35e86b
        );
      color: #01200f;
      text-decoration: none;
      padding: 10px 15px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 5px 14px rgba(20,210,91,0.16);
    }

    .news-button:active {
      transform: scale(0.97);
    }

    /* =========================
       HATA
    ========================== */

    .error {
      background: rgba(72,25,25,0.8);
      border: 1px solid #783737;
      color: #ffbcbc;
      padding: 18px;
      border-radius: 14px;
      line-height: 1.5;
    }

    /* =========================
       ALT MENÜ
    ========================== */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      background:
        linear-gradient(
          180deg,
          rgba(3,38,26,0.98),
          rgba(1,27,18,0.99)
        );
      border-top: 1px solid #174932;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
    }

    .bottom-nav a {
      text-decoration: none;
      color: #82aa95;
      font-size: 10px;
      text-align: center;
      min-width: 65px;
      transition: 0.2s ease;
    }

    .bottom-nav a.active {
      color: #35e86b;
      font-weight: 800;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
      line-height: 1;
    }

    .bottom-nav a.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(53,232,107,0.35));
    }

    /* =========================
       TABLET / DESKTOP
    ========================== */

    @media (min-width: 700px) {

      .container {
        padding-left: 20px;
        padding-right: 20px;
      }

      .hero {
        width: calc(100% + 40px);
        margin-left: -20px;
        border-radius: 0 0 28px 28px;
      }

      #news {
        max-width: 700px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    /* =========================
       MOBİL
    ========================== */

    @media (max-width: 500px) {

      .hero {
        height: 550px;
      }

      .hero-content {
        left: 21px;
        right: 16px;
        bottom: 31px;
      }

      .hero-title {
        font-size: 34px;
      }

      .hero-slogan {
        font-size: 10px;
        letter-spacing: 2.7px;
      }

      .hero-badge {
        top: 20px;
        right: 16px;
        font-size: 9px;
      }

      .news-image {
        height: 190px;
      }

      .news-title {
        font-size: 17px;
      }

      .news-description {
        font-size: 13px;
      }
    }

    @media (max-width: 360px) {

      .hero {
        height: 520px;
      }

      .hero-title {
        font-size: 30px;
      }

      .hero-slogan {
        font-size: 9px;
        letter-spacing: 2px;
      }

      .back-button {
        width: 44px;
        height: 44px;
      }

      .hero-badge {
        padding: 7px 9px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- KOCAELİSPOR TRİBÜN BANNER -->

    <section class="hero">

      <img
        class="hero-image"
        src="kocaelispor-tribun.webp"
        alt="Kocaelispor tribünleri"
      >

      <div class="hero-overlay"></div>

      <!-- GERİ -->

      <a class="back-button" href="index.html">
        ‹
      </a>

      <!-- ÜST ROZET -->

      <div class="hero-badge">
        KOCAELİSPOR
      </div>

      <!-- BAŞLIK -->

      <div class="hero-content">

        <h1 class="hero-title">

          <span class="kocaelispor">
            KOCAELİSPOR
          </span>

          <span class="haberleri-wrap">
            <span class="haberleri">
              HABERLERİ
            </span>
          </span>

        </h1>

        <div class="hero-line"></div>

        <div class="hero-slogan">
          BİR ŞEHRİN ORTAK SEVDASI
        </div>

      </div>

    </section>


    <!-- HABER DURUMU -->

    <div id="status">
      Haberler yükleniyor...
    </div>

    <!-- HABERLER -->

    <div id="news"></div>

  </main>


  <!-- ALT MENÜ -->

  <nav class="bottom-nav">

    <a href="index.html">

      <span class="nav-icon">
        🏠
      </span>

      Ana Sayfa

    </a>


    <a href="haberler.html">

      <span class="nav-icon">
        📰
      </span>

      Haberler

    </a>


    <a href="sport.html" class="active">

      <span class="nav-icon">
        🟢
      </span>

      Kocaelispor

    </a>


    <a href="ulasim.html">

      <span class="nav-icon">
        🚌
      </span>

      Ulaşım

    </a>

  </nav>


  <script>

    async function kocaelisporHaberleriniGetir() {

      const status =
        document.getElementById("status");

      const newsDiv =
        document.getElementById("news");


      for (let attempt = 1; attempt <= 3; attempt++) {

        try {

          status.style.display = "block";

          status.innerHTML =
            attempt === 1
              ? "Haberler yükleniyor..."
              : "Haberler yeniden deneniyor...";


          const response = await fetch(

            "https://kocaeli-cepte-api.vercel.app/api/kocaelispor?cache=" +
            Date.now(),

            {
              cache: "no-store"
            }

          );


          if (!response.ok) {

            throw new Error(
              "API bağlantısı başarısız"
            );

          }


          const data =
            await response.json();


          if (
            !data.success ||
            !data.items ||
            data.items.length === 0
          ) {

            throw new Error(
              "Haber bulunamadı"
            );

          }


          status.style.display = "none";


          function escapeHTML(text) {

            if (!text) return "";

            const div =
              document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
          }


          function formatDate(dateString) {

            if (!dateString) return "";

            const date =
              new Date(dateString);


            if (isNaN(date.getTime())) {

              return escapeHTML(
                dateString
              );

            }


            return date.toLocaleString(

              "tr-TR",

              {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }

            );

          }


          function cleanDescription(text) {

            if (!text) return "";


            const temp =
              document.createElement("div");


            temp.innerHTML = text;


            let clean =
              temp.textContent ||
              temp.innerText ||
              "";


            clean =
              clean
                .replace(/\s+/g, " ")
                .trim();


            if (clean.length > 300) {

              clean =
                clean.substring(0, 300) +
                "...";

            }


            return escapeHTML(clean);

          }


          newsDiv.innerHTML =

            data.items
              .slice(0, 20)
              .map(item => {

                const title =
                  escapeHTML(
                    item.title ||
                    "Kocaelispor Haberi"
                  );


                const description =
                  cleanDescription(
                    item.description
                  );


                const date =
                  formatDate(
                    item.date
                  );


                const source =
                  escapeHTML(
                    item.source || ""
                  );


                const image =
                  item.image || "";


                const imageHTML =
                  image

                    ? `

                      <img
                        class="news-image"
                        src="${escapeHTML(image)}"
                        alt="${title}"
                        loading="lazy"
                        onerror="this.style.display='none'"
                      >

                    `

                    : "";


                return `

                  <article class="news-card">

                    ${imageHTML}

                    <div class="news-content">

                      <div class="news-title">
                        ${title}
                      </div>


                      ${
                        date
                          ? `
                            <div class="news-date">
                              📅 ${date}
                            </div>
                          `
                          : ""
                      }


                      ${
                        description
                          ? `
                            <div class="news-description">
                              ${description}
                            </div>
                          `
                          : ""
                      }


                      ${
                        source
                          ? `
                            <div class="news-source">
                              📰 ${source}
                            </div>
                          `
                          : ""
                      }


                      ${
                        item.url
                          ? `
                            <a
                              class="news-button"
                              href="${escapeHTML(item.url)}"
                              target="_blank"
                              rel="noopener noreferrer"
                            >
                              Haberi Oku →
                            </a>
                          `
                          : ""
                      }

                    </div>

                  </article>

                `;

              })

              .join("");


          return;

        }


        catch (error) {

          console.error(

            "Kocaelispor haber denemesi:",
            attempt,
            error

          );


          if (attempt < 3) {

            await new Promise(

              resolve =>
                setTimeout(
                  resolve,
                  2500
                )

            );

          }

        }

      }


      status.style.display = "block";


      status.innerHTML = `

        <div class="error">

          ❌ Kocaelispor haberleri yüklenemedi.

          <br><br>

          Lütfen birkaç saniye sonra tekrar deneyin.

        </div>

      `;

    }


    kocaelisporHaberleriniGetir();

  </script>

</body>
</html>
