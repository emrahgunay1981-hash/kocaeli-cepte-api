<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kocaelispor Haberleri | Kocaeli Cepte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #061a12;
      color: #ffffff;
      padding-bottom: 80px;
    }

    header {
      background: #0a2419;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #173c2c;
    }

    .back {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #123827;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: white;
      font-size: 22px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #ffffff;
      color: #006b3c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .header-text {
      flex: 1;
    }

    .header-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 3px;
    }

    .header-subtitle {
      color: #9bc8b1;
      font-size: 12px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px 14px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      margin: 8px 0 18px;
    }

    .page-title span {
      color: #4bd48a;
    }

    #status {
      text-align: center;
      padding: 25px 10px;
      color: #9bc8b1;
      font-size: 14px;
    }

    .news-card {
      background: #0b2419;
      border: 1px solid #173c2c;
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.18);
    }

    .news-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #102d21;
    }

    .news-content {
      padding: 15px;
    }

    .news-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 9px;
    }

    .news-date,
    .news-source {
      color: #8dbba3;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .news-description {
      color: #c8d9d0;
      font-size: 14px;
      line-height: 1.5;
      margin: 8px 0 12px;
    }

    .news-button {
      display: inline-block;
      background: #087f49;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .news-button:active {
      transform: scale(0.98);
    }

    .error {
      background: #351818;
      border: 1px solid #6b2c2c;
      color: #ffb3b3;
      padding: 18px;
      border-radius: 14px;
      line-height: 1.5;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: #071b13;
      border-top: 1px solid #173c2c;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #8dbba3;
      font-size: 11px;
      text-align: center;
      min-width: 65px;
    }

    .bottom-nav a.active {
      color: #4bd48a;
      font-weight: 700;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }

    @media (max-width: 500px) {
      .news-image {
        height: 190px;
      }

      .news-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="back" href="index.html">‹</a>

    <div class="logo">41</div>

    <div class="header-text">
      <div class="header-title">KOCAELİSPOR</div>
      <div class="header-subtitle">Kocaelispor'dan son haberler</div>
    </div>
  </header>

  <main class="container">

    <div class="page-title">
      🟢 Kocaelispor <span>Haberleri</span>
    </div>

    <div id="status">
      Haberler yükleniyor...
    </div>

    <div id="news"></div>

  </main>

  <nav class="bottom-nav">
    <a href="index.html">
      <span class="nav-icon">🏠</span>
      Ana Sayfa
    </a>

    <a href="haberler.html">
      <span class="nav-icon">📰</span>
      Haberler
    </a>

    <a href="sport.html" class="active">
      <span class="nav-icon">🟢</span>
      Kocaelispor
    </a>

    <a href="ulasim.html">
      <span class="nav-icon">🚌</span>
      Ulaşım
    </a>
  </nav>

  <script>

    async function kocaelisporHaberleriniGetir() {

      const status = document.getElementById("status");
      const newsDiv = document.getElementById("news");

      /*
        API bazen ilk istekte geç cevap verebildiği için
        sayfayı yenilemeye gerek kalmadan 3 kez deniyoruz.
      */

      for (let attempt = 1; attempt <= 3; attempt++) {

        try {

          status.style.display = "block";

          status.innerHTML =
            attempt === 1
              ? "Haberler yükleniyor..."
              : "Haberler yeniden deneniyor...";

          const response = await fetch(
            "https://kocaeli-cepte-api.vercel.app/api/kocaelispor?cache=" + Date.now(),
            {
              cache: "no-store"
            }
          );

          if (!response.ok) {
            throw new Error("API bağlantısı başarısız");
          }

          const data = await response.json();

          if (
            !data.success ||
            !data.items ||
            data.items.length === 0
          ) {
            throw new Error("Haber bulunamadı");
          }

          status.style.display = "none";


          function escapeHTML(text) {

            if (!text) return "";

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
          }


          function formatDate(dateString) {

            if (!dateString) return "";

            const date = new Date(dateString);

            if (isNaN(date.getTime())) {
              return escapeHTML(dateString);
            }

            return date.toLocaleString("tr-TR", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit"
            });
          }


          function cleanDescription(text) {

            if (!text) return "";

            const temp = document.createElement("div");

            temp.innerHTML = text;

            let clean =
              temp.textContent ||
              temp.innerText ||
              "";

            clean = clean
              .replace(/\s+/g, " ")
              .trim();

            if (clean.length > 300) {
              clean =
                clean.substring(0, 300) +
                "...";
            }

            return escapeHTML(clean);
          }


          newsDiv.innerHTML = data.items
            .slice(0, 20)
            .map(item => {

              const title = escapeHTML(
                item.title ||
                "Kocaelispor Haberi"
              );

              const description =
                cleanDescription(
                  item.description
                );

              const date =
                formatDate(item.date);

              const source =
                escapeHTML(
                  item.source || ""
                );

              const image =
                item.image || "";

              const imageHTML =
                image
                  ? `
                    <img
                      class="news-image"
                      src="${escapeHTML(image)}"
                      alt="${title}"
                      loading="lazy"
                      onerror="this.style.display='none'"
                    >
                  `
                  : "";


              return `
                <article class="news-card">

                  ${imageHTML}

                  <div class="news-content">

                    <div class="news-title">
                      ${title}
                    </div>

                    ${
                      date
                        ? `
                          <div class="news-date">
                            📅 ${date}
                          </div>
                        `
                        : ""
                    }

                    ${
                      description
                        ? `
                          <div class="news-description">
                            ${description}
                          </div>
                        `
                        : ""
                    }

                    ${
                      source
                        ? `
                          <div class="news-source">
                            📰 ${source}
                          </div>
                        `
                        : ""
                    }

                    ${
                      item.url
                        ? `
                          <a
                            class="news-button"
                            href="${escapeHTML(item.url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                          >
                            Haberi Oku →
                          </a>
                        `
                        : ""
                    }

                  </div>

                </article>
              `;

            })
            .join("");


          /*
            Haberler başarıyla geldiyse
            fonksiyondan çıkıyoruz.
          */

          return;

        }

        catch (error) {

          console.error(
            "Kocaelispor haber denemesi:",
            attempt,
            error
          );

          /*
            Son deneme değilse 2,5 saniye bekle.
          */

          if (attempt < 3) {

            await new Promise(
              resolve =>
                setTimeout(resolve, 2500)
            );

          }

        }

      }


      /*
        3 denemede de başarısız olursa
        kullanıcıya hata göster.
      */

      status.style.display = "block";

      status.innerHTML = `
        <div class="error">
          ❌ Kocaelispor haberleri yüklenemedi.
          <br><br>
          Lütfen birkaç saniye sonra tekrar deneyin.
        </div>
      `;

    }


    /*
      Sayfa açılır açılmaz çalışır.
    */

    kocaelisporHaberleriniGetir();

  </script>

</body>
</html>
