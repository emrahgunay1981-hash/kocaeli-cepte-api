<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kocaelispor Haberleri | Kocaeli Cepte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #061a12;
      color: #fff;
      padding-bottom: 80px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 0 14px 20px;
    }

    /* =========================
       KOCAELİSPOR HERO
    ========================== */

    .hero {
      position: relative;
      width: calc(100% + 28px);
      margin-left: -14px;
      height: 600px;
      overflow: hidden;
      background: #020805;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: saturate(1.35) contrast(1.12);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.05) 0%,
          rgba(0,10,5,0.12) 40%,
          rgba(0,8,5,0.90) 100%
        );
    }

    /* GERİ BUTONU */

    .back-button {
      position: absolute;
      top: 22px;
      left: 22px;
      width: 52px;
      height: 52px;
      border-radius: 15px;
      background: rgba(0,70,42,0.85);
      border: 1px solid rgba(25,216,121,0.35);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      line-height: 1;
      z-index: 10;
    }

    .hero-content {
      position: absolute;
      left: 26px;
      right: 20px;
      bottom: 38px;
    }

    .hero-title {
      margin: 0;
      font-size: 40px;
      line-height: 0.98;
      font-weight: 900;
      letter-spacing: -1.5px;
      text-transform: uppercase;
    }

    /* KOCAELİSPOR YEŞİL */

    .hero-title .kocaelispor {
      display: block;
      color: #19d879;
      text-shadow: 0 2px 8px rgba(0,0,0,0.75);
    }

    /* HABERLERİ YEŞİL FIRÇA ÜZERİNDE SİYAH */

    .hero-title .haberleri-wrap {
      position: relative;
      display: inline-block;
      margin-top: 5px;
      padding: 5px 18px 8px 10px;
      z-index: 1;
    }

    .hero-title .haberleri-wrap::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: -14px;
      right: -20px;
      top: 2px;
      bottom: 0;
      background: #19d879;
      transform: skewX(-8deg);
      border-radius: 4px;
      box-shadow:
        -8px 5px 0 rgba(25,216,121,0.65),
        7px -3px 0 rgba(25,216,121,0.35);
    }

    .hero-title .haberleri {
      display: block;
      color: #020805;
      position: relative;
      z-index: 2;
      text-shadow: none;
    }

    .hero-line {
      width: 65px;
      height: 4px;
      background: #19d879;
      margin: 17px 0 13px;
      border-radius: 5px;
    }

    .hero-slogan {
      font-size: 14px;
      letter-spacing: 4px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    /* =========================
       HABERLER
    ========================== */

    #status {
      text-align: center;
      padding: 25px 10px;
      color: #9bc8b1;
      font-size: 14px;
    }

    .news-card {
      background: #0b2419;
      border: 1px solid #174b35;
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.18);
    }

    .news-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #102d21;
    }

    .news-content {
      padding: 15px;
    }

    .news-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 9px;
    }

    .news-date,
    .news-source {
      color: #8dbba3;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .news-description {
      color: #c8d9d0;
      font-size: 14px;
      line-height: 1.5;
      margin: 8px 0 12px;
    }

    .news-button {
      display: inline-block;
      background: #087f49;
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .news-button:active {
      transform: scale(0.98);
    }

    .error {
      background: #351818;
      border: 1px solid #6b2c2c;
      color: #ffb3b3;
      padding: 18px;
      border-radius: 14px;
      line-height: 1.5;
    }

    /* =========================
       ALT MENÜ
    ========================== */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: #071b13;
      border-top: 1px solid #173c2c;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .bottom-nav a {
      text-decoration: none;
      color: #8dbba3;
      font-size: 11px;
      text-align: center;
      min-width: 65px;
    }

    .bottom-nav a.active {
      color: #19d879;
      font-weight: 700;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }

    @media (max-width: 500px) {

      .hero {
        height: 600px;
      }

      .hero-content {
        left: 22px;
        bottom: 32px;
      }

      .hero-title {
        font-size: 34px;
      }

      .hero-slogan {
        font-size: 11px;
        letter-spacing: 3px;
      }

      .news-image {
        height: 190px;
      }

      .news-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- KOCAELİSPOR TRİBÜN BANNER -->

    <section class="hero">

      <img
        class="hero-image"
        src="kocaelispor-tribun.webp"
        alt="Kocaelispor tribünleri"
      >

      <div class="hero-overlay"></div>

      <!-- GERİ -->

      <a class="back-button" href="index.html">
        ‹
      </a>

      <!-- BAŞLIK -->

      <div class="hero-content">

        <h1 class="hero-title">

          <span class="kocaelispor">
            KOCAELİSPOR
          </span>

          <span class="haberleri-wrap">
            <span class="haberleri">
              HABERLERİ
            </span>
          </span>

        </h1>

        <div class="hero-line"></div>

        <div class="hero-slogan">
          BİR ŞEHRİN ORTAK SEVDASI
        </div>

      </div>

    </section>


    <div id="status">
      Haberler yükleniyor...
    </div>

    <div id="news"></div>

  </main>


  <!-- ALT MENÜ -->

  <nav class="bottom-nav">

    <a href="index.html">

      <span class="nav-icon">
        🏠
      </span>

      Ana Sayfa

    </a>


    <a href="haberler.html">

      <span class="nav-icon">
        📰
      </span>

      Haberler

    </a>


    <a href="sport.html" class="active">

      <span class="nav-icon">
        🟢
      </span>

      Kocaelispor

    </a>


    <a href="ulasim.html">

      <span class="nav-icon">
        🚌
      </span>

      Ulaşım

    </a>

  </nav>


  <script>

    async function kocaelisporHaberleriniGetir() {

      const status =
        document.getElementById("status");

      const newsDiv =
        document.getElementById("news");


      for (let attempt = 1; attempt <= 3; attempt++) {

        try {

          status.style.display = "block";

          status.innerHTML =
            attempt === 1
              ? "Haberler yükleniyor..."
              : "Haberler yeniden deneniyor...";


          const response = await fetch(

            "https://kocaeli-cepte-api.vercel.app/api/kocaelispor?cache=" +
            Date.now(),

            {
              cache: "no-store"
            }

          );


          if (!response.ok) {

            throw new Error(
              "API bağlantısı başarısız"
            );

          }


          const data =
            await response.json();


          if (
            !data.success ||
            !data.items ||
            data.items.length === 0
          ) {

            throw new Error(
              "Haber bulunamadı"
            );

          }


          status.style.display = "none";


          function escapeHTML(text) {

            if (!text) return "";

            const div =
              document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
          }


          function formatDate(dateString) {

            if (!dateString) return "";

            const date =
              new Date(dateString);


            if (isNaN(date.getTime())) {

              return escapeHTML(
                dateString
              );

            }


            return date.toLocaleString(

              "tr-TR",

              {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }

            );

          }


          function cleanDescription(text) {

            if (!text) return "";


            const temp =
              document.createElement("div");


            temp.innerHTML = text;


            let clean =
              temp.textContent ||
              temp.innerText ||
              "";


            clean =
              clean
                .replace(/\s+/g, " ")
                .trim();


            if (clean.length > 300) {

              clean =
                clean.substring(0, 300) +
                "...";

            }


            return escapeHTML(clean);

          }


          newsDiv.innerHTML =

            data.items
              .slice(0, 20)
              .map(item => {

                const title =
                  escapeHTML(
                    item.title ||
                    "Kocaelispor Haberi"
                  );


                const description =
                  cleanDescription(
                    item.description
                  );


                const date =
                  formatDate(
                    item.date
                  );


                const source =
                  escapeHTML(
                    item.source || ""
                  );


                const image =
                  item.image || "";


                const imageHTML =
                  image

                    ? `

                      <img
                        class="news-image"
                        src="${escapeHTML(image)}"
                        alt="${title}"
                        loading="lazy"
                        onerror="this.style.display='none'"
                      >

                    `

                    : "";


                return `

                  <article class="news-card">

                    ${imageHTML}

                    <div class="news-content">

                      <div class="news-title">
                        ${title}
                      </div>


                      ${
                        date
                          ? `
                            <div class="news-date">
                              📅 ${date}
                            </div>
                          `
                          : ""
                      }


                      ${
                        description
                          ? `
                            <div class="news-description">
                              ${description}
                            </div>
                          `
                          : ""
                      }


                      ${
                        source
                          ? `
                            <div class="news-source">
                              📰 ${source}
                            </div>
                          `
                          : ""
                      }


                      ${
                        item.url
                          ? `
                            <a
                              class="news-button"
                              href="${escapeHTML(item.url)}"
                              target="_blank"
                              rel="noopener noreferrer"
                            >
                              Haberi Oku →
                            </a>
                          `
                          : ""
                      }

                    </div>

                  </article>

                `;

              })

              .join("");


          return;

        }


        catch (error) {

          console.error(

            "Kocaelispor haber denemesi:",
            attempt,
            error

          );


          if (attempt < 3) {

            await new Promise(

              resolve =>
                setTimeout(
                  resolve,
                  2500
                )

            );

          }

        }

      }


      status.style.display = "block";


      status.innerHTML = `

        <div class="error">

          ❌ Kocaelispor haberleri yüklenemedi.

          <br><br>

          Lütfen birkaç saniye sonra tekrar deneyin.

        </div>

      `;

    }


    kocaelisporHaberleriniGetir();

  </script>

</body>
</html>
