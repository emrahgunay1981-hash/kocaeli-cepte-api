<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kocaeli Cepte - Nöbetçi Eczaneler</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
}

.header {
  padding: 18px 16px;
  background: #0d241a;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.header-title {
  font-size: 22px;
  font-weight: 800;
}

.header-sub {
  margin-top: 5px;
  color: #9aa8b7;
  font-size: 12px;
}

.container {
  padding: 15px;
  max-width: 700px;
  margin: auto;
}

select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.08);
  background: #0d241a;
  color: white;
  font-size: 15px;
  margin-bottom: 12px;
}

.info {
  background: #0d241a;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
  color: #aeb8c4;
  font-size: 12px;
  line-height: 1.5;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #aeb8c4;
}

.card {
  background: #0d241a;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 16px;
  padding: 15px;
  margin-bottom: 12px;
}

.name {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 8px;
}

.address {
  color: #aeb8c4;
  font-size: 13px;
  line-height: 1.5;
}

.phone {
  display: block;
  color: #12c95d;
  font-weight: 700;
  margin-top: 9px;
  text-decoration: none;
}

.buttons {
  display: flex;
  gap: 8px;
  margin-top: 13px;
}

.btn {
  flex: 1;
  text-align: center;
  padding: 11px 8px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 700;
  font-size: 13px;
}

.call {
  background: #12c95d;
  color: #07111f;
}

.map {
  background: #172b40;
  color: white;
}

.source {
  text-align: center;
  color: #748394;
  font-size: 11px;
  margin: 20px 0 8px;
  line-height: 1.6;
}

.source a {
  color: #12c95d;
  text-decoration: none;
}

.error {
  background: #32151a;
  color: #ffb4b4;
  padding: 14px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.5;
}

.count {
  color: #12c95d;
  font-weight: 700;
}

</style>
</head>

<body>

<div class="header">

  <div class="header-title">
    💊 Nöbetçi Eczaneler
  </div>

  <div class="header-sub">
    Kocaeli'de bugün nöbetçi eczaneler
  </div>

</div>


<div class="container">

  <select id="district">

    <option value="">
      Kocaeli - Tüm İlçeler
    </option>

    <option value="izmit">
      İzmit
    </option>

    <option value="gebze">
      Gebze
    </option>

    <option value="darica">
      Darıca
    </option>

    <option value="korfez">
      Körfez
    </option>

    <option value="basiskele">
      Başiskele
    </option>

    <option value="kartepe">
      Kartepe
    </option>

    <option value="golcuk">
      Gölcük
    </option>

    <option value="derince">
      Derince
    </option>

    <option value="cayirova">
      Çayırova
    </option>

    <option value="dilovasi">
      Dilovası
    </option>

    <option value="kandira">
      Kandıra
    </option>

    <option value="karamursel">
      Karamürsel
    </option>

  </select>


  <div class="info">

    📅 <strong id="today"></strong>

    <br>

    🕘 Nöbetçi eczane listesi günlük olarak güncellenir.

  </div>


  <div id="result">

    <div class="loading">
      💊 Eczaneler yükleniyor...
    </div>

  </div>


  <div class="source">

    Veri: <a href="https://eczaneadresi.com" target="_blank">
      Eczane Adresi
    </a>

    <br>

    Nöbetçi eczane bilgileri günlük olarak güncellenmektedir.

    <br>

    Gece gitmeden önce eczaneyi telefonla teyit etmeniz önerilir.

  </div>

</div>


<script>

const district =
document.getElementById("district");

const result =
document.getElementById("result");

const today =
document.getElementById("today");


// BUGÜNÜN TARİHİ

const now = new Date();

today.textContent =
now.toLocaleDateString("tr-TR", {
  day: "numeric",
  month: "long",
  year: "numeric"
});


// ==========================================
// EGZANEADRESİ.COM'UN RESMİ WIDGET SCRİPTİ
// (fetch/CORS değil — <script> ile çalışır,
// bu yüzden tarayıcı engeline takılmaz)
// ==========================================

function loadWidget() {

  result.innerHTML = "";


  const widgetDiv =
    document.createElement("div");

  widgetDiv.id =
    "eczane-adresi-widget";

  widgetDiv.setAttribute(
    "data-theme",
    "dark"
  );

  widgetDiv.setAttribute(
    "data-accent",
    "#12c95d"
  );

  widgetDiv.setAttribute(
    "data-map",
    "true"
  );

  widgetDiv.setAttribute(
    "data-limit",
    "30"
  );


  if (district.value) {

    widgetDiv.setAttribute(
      "data-scope",
      "district"
    );

    widgetDiv.setAttribute(
      "data-city",
      "kocaeli"
    );

    widgetDiv.setAttribute(
      "data-district",
      district.value
    );

  } else {

    widgetDiv.setAttribute(
      "data-scope",
      "city"
    );

    widgetDiv.setAttribute(
      "data-city",
      "kocaeli"
    );

  }


  result.appendChild(widgetDiv);


  // Script'i her seferinde yeniden ekleyip
  // çalıştırıyoruz (cache'lense bile
  // yeniden tetiklenmesi için).

  const script =
    document.createElement("script");

  script.src =
    "https://eczaneadresi.com/api/public/widget/embed.js";

  script.async = true;

  document.body.appendChild(script);

}


// İLÇE DEĞİŞİNCE

district.addEventListener(
  "change",
  loadWidget
);


// SAYFA AÇILINCA

loadWidget();

</script>

</body>
</html>
