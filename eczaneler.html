<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#078897">
<title>Kocaeli Cepte - Nöbetçi Eczaneler</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(0,207,232,.12), transparent 30%), radial-gradient(circle at bottom left, rgba(0,207,232,.07), transparent 35%), #061B35; color: #F5FAFF; min-height: 100vh; }
.header { padding: 18px 16px; background: linear-gradient(135deg, #087F91, #00AFC3); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(255,255,255,.15); box-shadow: 0 8px 25px rgba(0,0,0,.18); }
.header-title { font-size: 22px; font-weight: 800; letter-spacing: .2px; }
.header-sub { margin-top: 5px; color: rgba(255,255,255,.82); font-size: 12px; }
.container { padding: 15px; max-width: 700px; margin: auto; }
.info { background: linear-gradient(135deg, #0A2948, #0D3558); border: 1px solid rgba(56,232,245,.16); border-radius: 16px; padding: 14px; margin-bottom: 14px; color: #B8CBD9; font-size: 12px; line-height: 1.6; box-shadow: 0 8px 25px rgba(0,0,0,.15); }
#result { margin-top: 4px; }
.loading { text-align: center; padding: 35px 20px; color: #9DB7CC; background: #0A2948; border-radius: 16px; border: 1px solid rgba(255,255,255,.06); }
.card { background: linear-gradient(145deg, #0A2948, #08243F); border: 1px solid rgba(56,232,245,.12); border-radius: 17px; padding: 16px; margin-bottom: 13px; box-shadow: 0 8px 25px rgba(0,0,0,.18); }
.name { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: #F5FAFF; }
.address { color: #AFC3D2; font-size: 13px; line-height: 1.55; }
.phone { display: block; color: #38E8F5; font-weight: 700; margin-top: 10px; text-decoration: none; }
.buttons { display: flex; gap: 8px; margin-top: 14px; }
.btn { flex: 1; text-align: center; padding: 12px 8px; border-radius: 11px; text-decoration: none; font-weight: 700; font-size: 13px; transition: .2s ease; }
.btn:active { transform: scale(.97); }
.call { background: linear-gradient(135deg, #00CFE8, #00AFC3); color: #03202A; box-shadow: 0 5px 15px rgba(0,207,232,.15); }
.map { background: #123A5D; color: #F5FAFF; border: 1px solid rgba(56,232,245,.12); }
.source { text-align: center; color: #748FA5; font-size: 11px; margin: 22px 0 10px; line-height: 1.7; }
.source a { color: #38E8F5; text-decoration: none; font-weight: 700; }
.error { background: linear-gradient(135deg, #32151A, #421B22); color: #FFB4B4; padding: 14px; border-radius: 13px; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div class="header">
 <div class="header-title">Nöbetçi Eczaneler</div>
 <div class="header-sub">Kocaeli Güncel Listesi</div>
</div>

<div class="container">
 <div class="info">
 Veriler her gün otomatik olarak güncellenir. Kaynak: Kocaeli Eczacı Odası verileri üzerinden derlenmiştir.
 </div>
 
 <div id="result">
 <div class="loading">Eczaneler yükleniyor...</div>
 </div>
 
 <div class="source">
 Veri kaynağı: <a href="https://www.bugunkocaeli.com.tr/kocaeli-nobetci-eczaneler" target="_blank">Bugün Kocaeli</a>
 </div>
</div>

<script>
const SOURCE_URL = "https://www.bugunkocaeli.com.tr/kocaeli-nobetci-eczaneler";
// Proxy kullanarak CORS sorununu aşıyoruz
const PROXY_URL = "https://api.allorigins.win/get?url=" + encodeURIComponent(SOURCE_URL);

const DISTRICTS = [
 "Başiskele", "Çayırova", "Darıca", "Derince", "Dilovası",
 "Gebze", "Gölcük", "İzmit", "Kandıra", "Karamürsel", "Kartepe", "Körfez"
];

function cleanText(text) {
 if (!text) return "";
 return String(text)
 .replace(/<script[\s\S]*?<\/script>/gi, "")
 .replace(/<style[\s\S]*?<\/style>/gi, "")
 .replace(/<[^>]+>/g, " ")
 .replace(/&nbsp;/gi, " ")
 .replace(/&amp;/gi, "&")
 .replace(/&quot;/gi, '"')
 .replace(/&#39;/gi, "'")
 .replace(/&#x27;/gi, "'")
 .replace(/&apos;/gi, "'")
 .replace(/&lt;/gi, "<")
 .replace(/&gt;/gi, ">")
 .replace(/\s+/g, " ")
 .trim();
}

function normalize(text) {
 return String(text || "").toLocaleLowerCase("tr-TR")
 .replace(/ı/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u")
 .replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c")
 .trim();
}

function getDistrict(text) {
 const normalized = normalize(text);
 for (const district of DISTRICTS) {
 if (normalized.includes(normalize(district))) return district;
 }
 return "";
}

function getPhone(text) {
 const match = String(text).match(/0?\s*$?262$?[\s.-]*\d{3}[\s.-]*\d{2}[\s.-]*\d{2}/);
 return match ? match.replace(/\s+/g, " ").trim() : "";
}

function getMapLink(address) {
 return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address + ", Kocaeli");
}

function parsePharmacies(html) {
 const pharmacies = ;
 // Site yapısı değişmiş olabilir, h4 yerine başka etiketler de kontrol edilebilir
 const headingRegex = /<h[1-6][^>]*>([\s\S]*?)<\/h[1-6]>/gi;
 const headings = ;
 let match;

 while ((match = headingRegex.exec(html)) !== null) {
 const name = cleanText(match); [1]
 if (!name) continue;
 if (/eczane/i.test(name) && !/nöbetçi eczane/i.test(name)) {
 headings.push({ name, start: match.index, end: headingRegex.lastIndex });
 }
 }

 for (let i = 0; i < headings.length; i++) {
 const current = headings[i];
 const next = headings[i + 1];
 const block = html.slice(current.end, next ? next.start : undefined);
 const text = cleanText(block);
 const district = getDistrict(text);
 if (!district) continue;

 const phone = getPhone(text);
 let address = text;
 if (phone) address = address.replace(phone, "");
 address = address.replace(/Yol Tarifi Al/gi, "").replace(/Haritada Göster/gi, "").replace(/Ara/gi, "").replace(/\*/g, " ").replace(/\s+/g, " ").trim();
 
 address = address.replace(/Her eczane gece boyunca açık olmayabilir[\s\S]*\$/i, "").trim();

 pharmacies.push({
 name: current.name,
 district,
 address: address || district + ", Kocaeli",
 phone,
 map: getMapLink(address || district),
 source: "Bugün Kocaeli"
 });
 }

 const seen = new Set();
 return pharmacies.filter(pharmacy => {
 const key = normalize(pharmacy.name) + "|" + normalize(pharmacy.district);
 if (seen.has(key)) return false;
 seen.add(key);
 return true;
 });
}

async function loadPharmacies() {
 const resultDiv = document.getElementById('result');

 try {
 const response = await fetch(PROXY_URL);
 const json = await response.json();
 
 if (!json.contents) throw new Error("Veri alınamadı");

 let pharmacies = parsePharmacies(json.contents);

 if (pharmacies.length === 0) {
 resultDiv.innerHTML = '<div class="error">Hiçbir eczane bulunamadı. Site yapısı değişmiş olabilir.</div>';
 console.log("Parse edilen HTML:", json.contents.substring(0, 500)); // Debug için
 return;
 }

 resultDiv.innerHTML = '';
 
 pharmacies.forEach(pharmacy => {
 const card = document.createElement('div');
 card.className = 'card';
 
 const phoneHtml = pharmacy.phone ? `<a href="tel:\${pharmacy.phone}" class="phone">\${pharmacy.phone}</a>` : '';
 const mapHtml = pharmacy.map ? `<a href="\${pharmacy.map}" target="_blank" class="btn map">Haritada Göster</a>` : '';
 const callHtml = pharmacy.phone ? `<a href="tel:\${pharmacy.phone}" class="btn call">Ara</a>` : '';

 card.innerHTML = `
 <div class="name">\${pharmacy.name}</div>
 <div class="address">\${pharmacy.district} • \${pharmacy.address}</div>
 \${phoneHtml}
 <div class="buttons">
 \${callHtml}
 \${mapHtml}
 </div>
 `;
 resultDiv.appendChild(card);
 });

 } catch (err) {
 console.error(err);
 resultDiv.innerHTML = '<div class="error">Bir bağlantı hatası oluştu. Lütfen sayfanızı yenileyin.</div>';
 }
}

document.addEventListener('DOMContentLoaded', loadPharmacies);
</script>

</body>
</html>
