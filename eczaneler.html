<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#078897">
<title>Kocaeli Cepte - Nöbetçi Eczaneler</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top right, rgba(0,207,232,.12), transparent 30%), radial-gradient(circle at bottom left, rgba(0,207,232,.07), transparent 35%), #061B35; color: #F5FAFF; min-height: 100vh; }
.header { padding: 18px 16px; background: linear-gradient(135deg, #087F91, #00AFC3); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid rgba(255,255,255,.15); box-shadow: 0 8px 25px rgba(0,0,0,.18); }
.header-title { font-size: 22px; font-weight: 800; letter-spacing: .2px; }
.header-sub { margin-top: 5px; color: rgba(255,255,255,.82); font-size: 12px; }
.container { padding: 15px; max-width: 700px; margin: auto; }
.info { background: linear-gradient(135deg, #0A2948, #0D3558); border: 1px solid rgba(56,232,245,.16); border-radius: 16px; padding: 14px; margin-bottom: 14px; color: #B8CBD9; font-size: 12px; line-height: 1.6; box-shadow: 0 8px 25px rgba(0,0,0,.15); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 20px; background: #0A2948; border: 1px solid rgba(56,232,245,.18); color: #B8CBD9; font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip.active { background: linear-gradient(135deg, #00CFE8, #00AFC3); color: #03202A; border-color: transparent; }
#result { margin-top: 4px; }
.loading { text-align: center; padding: 35px 20px; color: #9DB7CC; background: #0A2948; border-radius: 16px; border: 1px solid rgba(255,255,255,.06); }
.card { background: linear-gradient(145deg, #0A2948, #08243F); border: 1px solid rgba(56,232,245,.12); border-radius: 17px; padding: 16px; margin-bottom: 13px; box-shadow: 0 8px 25px rgba(0,0,0,.18); }
.name { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: #F5FAFF; }
.address { color: #AFC3D2; font-size: 13px; line-height: 1.55; }
.phone { display: block; color: #38E8F5; font-weight: 700; margin-top: 10px; text-decoration: none; }
.buttons { display: flex; gap: 8px; margin-top: 14px; }
.btn { flex: 1; text-align: center; padding: 12px 8px; border-radius: 11px; text-decoration: none; font-weight: 700; font-size: 13px; transition: .2s ease; border: none; cursor: pointer; }
.btn:active { transform: scale(.97); }
.call { background: linear-gradient(135deg, #00CFE8, #00AFC3); color: #03202A; box-shadow: 0 5px 15px rgba(0,207,232,.15); }
.map { background: #123A5D; color: #F5FAFF; border: 1px solid rgba(56,232,245,.12); }
.source { text-align: center; color: #748FA5; font-size: 11px; margin: 22px 0 10px; line-height: 1.7; }
.source a { color: #38E8F5; text-decoration: none; font-weight: 700; }
.error { background: linear-gradient(135deg, #32151A, #421B22); color: #FFB4B4; padding: 14px; border-radius: 13px; font-size: 13px; text-align: center; }
.locate-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; margin-bottom: 14px; border: none; border-radius: 14px; background: linear-gradient(135deg, #00CFE8, #00AFC3); color: #03202A; font-size: 13px; font-weight: 800; cursor: pointer; box-shadow: 0 6px 18px rgba(0,207,232,.18); }
.locate-btn:active { transform: scale(.98); }
.locate-btn[disabled] { opacity: .6; }
.locate-status { text-align: center; color: #8FD9E3; font-size: 11px; margin: -6px 0 14px; min-height: 14px; }
</style>
</head>
<body>

<div class="header">
 <div class="header-title">Nöbetçi Eczaneler</div>
 <div class="header-sub">Kocaeli Güncel Listesi</div>
</div>

<div class="container">
 <div class="info">
 Veriler her gün otomatik olarak güncellenir.
 </div>

 <button class="locate-btn" id="locateBtn">📍 Yakınımdaki Eczaneleri Bul</button>
 <div class="locate-status" id="locateStatus"></div>

 <div class="filters" id="filters"></div>

 <div id="result">
 <div class="loading">Eczaneler yükleniyor...</div>
 </div>

 <div class="source">
 Veri kaynağı: <a href="https://www.fanatik.com.tr/nobetci-eczaneler/kocaeli/" target="_blank">Fanatik</a>
 </div>
</div>

<script>
const API_URL = "/api/eczaneler";

const DISTRICTS = [
  "Başiskele", "Çayırova", "Darıca", "Derince", "Dilovası",
  "Gebze", "Gölcük", "İzmit", "Kandıra", "Karamürsel", "Kartepe", "Körfez"
];

// İlçelerin yaklaşık merkez koordinatları (eczane bazında değil,
// ilçe bazında en yakını bulmak için yeterli)
const DISTRICT_COORDS = {
  "Başiskele": { lat: 40.7301, lng: 29.9542 },
  "Çayırova":  { lat: 40.8228, lng: 29.3775 },
  "Darıca":    { lat: 40.7684, lng: 29.3853 },
  "Derince":   { lat: 40.7580, lng: 29.8130 },
  "Dilovası":  { lat: 40.7853, lng: 29.5456 },
  "Gebze":     { lat: 40.8022, lng: 29.4306 },
  "Gölcük":    { lat: 40.7167, lng: 29.8167 },
  "İzmit":     { lat: 40.7654, lng: 29.9408 },
  "Kandıra":   { lat: 41.0700, lng: 30.1500 },
  "Karamürsel":{ lat: 40.6900, lng: 29.6100 },
  "Kartepe":   { lat: 40.7333, lng: 30.0333 },
  "Körfez":    { lat: 40.7736, lng: 29.7736 }
};

let allPharmacies = [];
let activeDistrict = "";

// İki koordinat arası kuş uçuşu mesafe (km) - Haversine formülü
function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function findNearestDistrict(userLat, userLng) {
  let nearest = null;
  let nearestDist = Infinity;

  DISTRICTS.forEach(district => {
    const coords = DISTRICT_COORDS[district];
    if (!coords) return;

    const dist = distanceKm(userLat, userLng, coords.lat, coords.lng);

    if (dist < nearestDist) {
      nearestDist = dist;
      nearest = district;
    }
  });

  return { district: nearest, distance: nearestDist };
}

function renderFilters() {
  const filtersDiv = document.getElementById('filters');
  const chips = ["Tümü", ...DISTRICTS];
  filtersDiv.innerHTML = chips.map(label => {
    const isAll = label === "Tümü";
    const value = isAll ? "" : label;
    const isActive = activeDistrict === value;
    return `<button class="chip${isActive ? ' active' : ''}" data-district="${value}">${label}</button>`;
  }).join('');

  filtersDiv.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeDistrict = chip.getAttribute('data-district');
      renderFilters();
      renderPharmacies();
    });
  });
}

function renderPharmacies() {
  const resultDiv = document.getElementById('result');
  const list = activeDistrict
    ? allPharmacies.filter(p => p.district === activeDistrict)
    : allPharmacies;

  if (list.length === 0) {
    resultDiv.innerHTML = '<div class="error">Bu ilçede nöbetçi eczane bulunamadı.</div>';
    return;
  }

  resultDiv.innerHTML = '';
  list.forEach(pharmacy => {
    const card = document.createElement('div');
    card.className = 'card';

    const phoneHtml = pharmacy.phone ? `<a href="tel:${pharmacy.phone}" class="phone">${pharmacy.phone}</a>` : '';
    const mapHtml = pharmacy.map ? `<a href="${pharmacy.map}" target="_blank" class="btn map">Haritada Göster</a>` : '';
    const callHtml = pharmacy.phone ? `<a href="tel:${pharmacy.phone}" class="btn call">Ara</a>` : '';

    card.innerHTML = `
      <div class="name">${pharmacy.name}</div>
      <div class="address">${pharmacy.district} • ${pharmacy.address}</div>
      ${phoneHtml}
      <div class="buttons">
        ${callHtml}
        ${mapHtml}
      </div>
    `;
    resultDiv.appendChild(card);
  });
}

async function loadPharmacies() {
  const resultDiv = document.getElementById('result');

  try {
    const response = await fetch(API_URL);
    const json = await response.json();

    if (!json.success) throw new Error(json.error || "Veri alınamadı");

    allPharmacies = json.data || [];

    if (allPharmacies.length === 0) {
      resultDiv.innerHTML = '<div class="error">Hiçbir eczane bulunamadı. Site yapısı değişmiş olabilir.</div>';
      return;
    }

    renderFilters();
    renderPharmacies();

  } catch (err) {
    console.error(err);
    resultDiv.innerHTML = '<div class="error">Bir bağlantı hatası oluştu. Lütfen sayfanızı yenileyin.</div>';
  }
}

function locateNearestDistrict() {
  const locateBtn = document.getElementById('locateBtn');
  const statusDiv = document.getElementById('locateStatus');

  if (!navigator.geolocation) {
    statusDiv.textContent = 'Cihazınız konum özelliğini desteklemiyor.';
    return;
  }

  locateBtn.disabled = true;
  locateBtn.textContent = '📍 Konum alınıyor...';
  statusDiv.textContent = '';

  navigator.geolocation.getCurrentPosition(
    position => {
      const { latitude, longitude } = position.coords;
      const result = findNearestDistrict(latitude, longitude);

      locateBtn.disabled = false;
      locateBtn.textContent = '📍 Yakınımdaki Eczaneleri Bul';

      if (!result.district) {
        statusDiv.textContent = 'En yakın ilçe belirlenemedi.';
        return;
      }

      activeDistrict = result.district;
      statusDiv.textContent = `En yakın ilçe: ${result.district} olarak seçildi`;
      renderFilters();
      renderPharmacies();
      document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    },
    error => {
      locateBtn.disabled = false;
      locateBtn.textContent = '📍 Yakınımdaki Eczaneleri Bul';

      if (error.code === error.PERMISSION_DENIED) {
        statusDiv.textContent = 'Konum izni verilmedi. Tarayıcı ayarlarından izin verebilirsiniz.';
      } else {
        statusDiv.textContent = 'Konum alınamadı, lütfen tekrar deneyin.';
      }
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 }
  );
}

document.getElementById('locateBtn').addEventListener('click', locateNearestDistrict);

document.addEventListener('DOMContentLoaded', loadPharmacies);
</script>

</body>
</html>
